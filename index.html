<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primary Turtle Trek — Riverton 24th Tongan Ward</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        h1, h2, h3, .fun { font-family: 'Baloo 2', 'Inter', sans-serif; }
        @keyframes waddle { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
        @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
        @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
        @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0);opacity:1;} 100%{transform:translateY(100vh) rotate(720deg);opacity:0;} }
        @keyframes waveMove { 0%{background-position-x:0;} 100%{background-position-x:80px;} }
        @keyframes bgShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        body { background: linear-gradient(135deg,#cffafe,#e0f2fe,#fef9c3,#dcfce7,#e0f2fe); background-size: 400% 400%; animation: bgShift 24s ease infinite; }
        button { transition: transform .12s cubic-bezier(0.34,1.6,0.64,1); }
        button:active { transform: scale(0.94); }
        .turtle { animation: waddle 1.5s ease-in-out infinite; display:inline-block; }
        .floaty { animation: floaty 3s ease-in-out infinite; display:inline-block; }
        .pop { animation: pop .4s ease-out; }
        .trail { background: linear-gradient(180deg,#7dd3fc 0%,#38bdf8 55%,#fde68a 56%,#fcd34d 100%); position:relative; overflow:hidden; }
        .trail::after { content:''; position:absolute; left:0; right:0; top:0; height:55%; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 8px, transparent 8px 40px); animation: waveMove 4s linear infinite; opacity:.5; }
        .racer { transition: left 1.2s cubic-bezier(0.34,1.2,0.64,1); }
        .confetti-piece { position:fixed; top:0; width:10px; height:10px; z-index:9999; animation: confettiFall 2.5s linear forwards; }
        .card { background:#fff; border-radius:28px; box-shadow:0 12px 30px rgba(14,116,144,.14); }
        .mission { border-radius:22px; padding:14px 10px; text-align:center; border:3px solid transparent; cursor:pointer; min-height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
        .mission .e { font-size:38px; line-height:1; }
        .mission .t { font-weight:800; font-size:14px; line-height:1.2; }
        .mission .n { font-size:11px; font-weight:800; opacity:.75; }
        .big .card { border-radius:36px; }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>
    <div id="confetti"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, remove, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAmPDiDkM6Dq2BTmMExUy9KTD9XDDODgno",
            authDomain: "the-challenge-1bb53.firebaseapp.com",
            databaseURL: "https://the-challenge-1bb53-default-rtdb.firebaseio.com",
            projectId: "the-challenge-1bb53",
            storageBucket: "the-challenge-1bb53.firebasestorage.app",
            messagingSenderId: "660247853699",
            appId: "1:660247853699:web:cd57840a30934e898879b6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ───────── Easy things to change ─────────
        const APP_NAME = 'Primary Turtle Trek';
        const WARD = 'Riverton 24th Tongan Ward';
        const PAGE_URL = 'https://filipefa1998-sudo.github.io/The-Challenge/';   // keep the trailing slash
        const LEADER_CODE = 'riverton24';
        const DEFAULT_CLASSES = ['Nursery', 'Sunbeams', 'CTR', 'Valiant'];
        const DEFAULTS = { goal: 100, reward: 'Primary beach party! 🏖️', perChild: 10 };
        // Primary data lives inside the same "theChallenge" area the database already allows (the old race sign-ups beside it are left untouched).
        const ROOT = 'theChallenge/primary';

        // Missions — small things a child can do to love, share, and invite
        const LANES = {
            love:   { name:'Love',   emoji:'💛', bg:'#FFE4EC', border:'#F472B6', text:'#9D174D', solid:'#EC4899' },
            share:  { name:'Share',  emoji:'🤲', bg:'#D1FAE5', border:'#34D399', text:'#065F46', solid:'#10B981' },
            invite: { name:'Invite', emoji:'✉️', bg:'#FEF3C7', border:'#FBBF24', text:'#92400E', solid:'#F59E0B' }
        };
        const MISSIONS = [
            { id:'pray',    lane:'love',   e:'🙏', t:'I prayed for a friend' },
            { id:'loved',   lane:'love',   e:'🤗', t:'I told someone God loves them' },
            { id:'friend',  lane:'love',   e:'👋', t:'I made a new friend' },
            { id:'helper',  lane:'love',   e:'🧹', t:'I helped a neighbor' },
            { id:'kind',    lane:'love',   e:'🌺', t:'I was kind to someone left out' },
            { id:'story',   lane:'share',  e:'💬', t:'I told how God answered my prayer' },
            { id:'example', lane:'share',  e:'⭐', t:'I was a good example' },
            { id:'friendmag', lane:'share', e:'📰', t:'I shared a Friend story or video' },
            { id:'song',    lane:'share',  e:'🎵', t:'I sang a Primary song for someone' },
            { id:'read',    lane:'share',  e:'📖', t:'I read a scripture story' },
            { id:'church',  lane:'invite', e:'⛪', t:'I invited a friend to church' },
            { id:'activity',lane:'invite', e:'🎉', t:'I invited a friend to a Primary activity' },
            { id:'family',  lane:'invite', e:'🏠', t:'I invited my family to read or pray' }
        ];
        const M = Object.fromEntries(MISSIONS.map(m => [m.id, m]));
        const CLASS_TURTLES = ['🐢','🐠','🦀','🐬','🐙','🦭','🐳','🦜'];
        const CLASS_TINT = ['#0EA5E9','#F97316','#EF4444','#8B5CF6','#EC4899','#14B8A6','#3B82F6','#22C55E'];
        // My turtle grows as I do missions
        const GROW = [ {min:0, e:'🥚', label:'Egg'}, {min:1, e:'🐣', label:'Hatchling'}, {min:5, e:'🐢', label:'Sea turtle'}, {min:15, e:'🐢👑', label:'Turtle captain'} ];
        const STICKERS = [
            { id:'first',  e:'🌱', label:'First mission',      test:k => count(k) >= 1 },
            { id:'love3',  e:'💛', label:'Love ×3',            test:k => laneCount(k,'love') >= 3 },
            { id:'share3', e:'🤲', label:'Share ×3',           test:k => laneCount(k,'share') >= 3 },
            { id:'invite1',e:'✉️', label:'First invitation',   test:k => laneCount(k,'invite') >= 1 },
            { id:'rainbow',e:'🌈', label:'All three colors',   test:k => ['love','share','invite'].every(l => laneCount(k,l) >= 1) },
            { id:'ten',    e:'⭐', label:'10 missions',        test:k => count(k) >= 10 },
            { id:'captain',e:'👑', label:'25 missions',        test:k => count(k) >= 25 }
        ];
        const THOUGHTS = [
            { ref:'John 13:34', text:'Love one another.' },
            { ref:'1 Nephi 3:7', text:'I will go and do.' },
            { ref:'Ephesians 4:32', text:'Be ye kind one to another.' },
            { ref:'Alma 37:6', text:'By small and simple things are great things brought to pass.' },
            { ref:'Matthew 5:16', text:'Let your light so shine.' },
            { ref:'Mosiah 2:17', text:'When ye are in the service of your fellow beings ye are only in the service of your God.' }
        ];
        const thought = () => THOUGHTS[Math.floor(Date.now() / 86400000) % THOUGHTS.length];

        let state = {
            kids: [], stories: [], settings: { ...DEFAULTS },
            loaded: { kids:false, settings:false },
            me: localStorage.getItem('ptt_me') || '',
            // Children this device has added or opened — so one phone can hold a whole family (or a teacher's class)
            mine: (function(){ try{ const a=JSON.parse(localStorage.getItem('ptt_mine')||'null'); if(Array.isArray(a)) return a; }catch(e){} const m=localStorage.getItem('ptt_me'); return m?[m]:[]; })(),
            justAdded: [],
            view: 'home', leader: false, message: '', openClass: ''
        };
        // Old QR codes and links (#join-read, #join-21, #join-bom) still work — they open the join page.
        if ((window.location.hash || '').startsWith('#join')) state.view = 'join';
        if (window.location.hash === '#big') state.view = 'big';

        // If the database refuses or is slow, still open the app and say what is wrong instead of loading forever
        const dbFail = (what) => (err) => { console.warn('Database:', what, err && err.message); state.dbError = (err && err.code) || 'error'; state.loaded.kids = true; state.loaded.settings = true; softRender(); };
        onValue(ref(db, ROOT + '/kids'), s => { const d = s.val() || {}; state.kids = Object.keys(d).map(id => ({ id, ...d[id] })); state.loaded.kids = true; state.dbError = ''; softRender(); }, dbFail('kids'));
        onValue(ref(db, ROOT + '/stories'), s => { const d = s.val() || {}; state.stories = Object.keys(d).map(id => ({ id, ...d[id] })).sort((a, b) => (b.ts || 0) - (a.ts || 0)); softRender(); }, dbFail('stories'));
        onValue(ref(db, ROOT + '/settings'), s => { state.settings = { ...DEFAULTS, ...(s.val() || {}) }; state.loaded.settings = true; softRender(); }, dbFail('settings'));
        setTimeout(() => { if (!(state.loaded.kids && state.loaded.settings)) { state.dbError = state.dbError || 'slow'; state.loaded.kids = true; state.loaded.settings = true; softRender(); } }, 8000);

        // ───────── helpers ─────────
        const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        const classes = () => { const c = (state.settings.classes || '').split(',').map(x => x.trim()).filter(Boolean); return c.length ? c : DEFAULT_CLASSES; };
        const classIdx = c => Math.max(0, classes().indexOf(c));
        const classTurtle = c => CLASS_TURTLES[classIdx(c) % CLASS_TURTLES.length];
        const classTint = c => CLASS_TINT[classIdx(c) % CLASS_TINT.length];
        const logOf = k => Object.entries(k.log || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.ts || 0) - (b.ts || 0));
        const count = k => Object.keys(k.log || {}).length;
        const laneCount = (k, lane) => logOf(k).filter(x => M[x.m] && M[x.m].lane === lane).length;
        const weekStart = () => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); };
        const weekCount = k => logOf(k).filter(x => (x.ts || 0) >= weekStart()).length;
        const me = () => state.kids.find(k => k.id === state.me) || null;
        const myKids = () => state.mine.map(id => state.kids.find(k => k.id === id)).filter(Boolean);
        function saveMine(){ try{ localStorage.setItem('ptt_mine', JSON.stringify(state.mine)); }catch(e){} }
        function addMine(id){ if(!state.mine.includes(id)){ state.mine = [...state.mine, id]; saveMine(); } }
        function dropMine(id){ state.mine = state.mine.filter(x => x !== id); saveMine(); }
        const kidsIn = c => state.kids.filter(k => k.cls === c).sort((a, b) => (a.name || '').localeCompare(b.name || ''));
        const total = () => state.kids.reduce((s, k) => s + count(k), 0);
        const growFor = n => { let g = GROW[0]; for (const x of GROW) if (n >= x.min) g = x; return g; };
        const nextGrow = n => GROW.find(x => x.min > n) || null;
        const stickersOf = k => STICKERS.filter(s => s.test(k));
        // A class moves by the average missions per child, so small and large classes are on equal footing
        function classProgress(c) {
            const ks = kidsIn(c); if (!ks.length) return 0;
            const per = Math.max(1, +state.settings.perChild || DEFAULTS.perChild);
            return Math.min(1, ks.reduce((s, k) => s + count(k), 0) / ks.length / per);
        }
        const classTotal = c => kidsIn(c).reduce((s, k) => s + count(k), 0);
        const starStory = () => state.stories.find(s => s.star) || null;

        function confetti(){ const c=document.getElementById('confetti'); const cols=['#f59e0b','#ef4444','#3b82f6','#10b981','#8b5cf6','#ec4899']; for(let i=0;i<60;i++){ const el=document.createElement('div'); el.className='confetti-piece'; el.style.left=Math.random()*100+'%'; el.style.background=cols[Math.floor(Math.random()*cols.length)]; el.style.animationDelay=Math.random()*0.5+'s'; el.style.borderRadius=Math.random()>0.5?'50%':'0'; c.appendChild(el); setTimeout(()=>el.remove(),3000);} }
        let _msgT = null;
        function showMessage(m){ state.message = m; render(); clearTimeout(_msgT); _msgT = setTimeout(() => { state.message = ''; softRender(); }, 3500); }
        // Don't rebuild the page while someone is typing (keeps the keyboard open and the text in place)
        function typing(){ const a = document.activeElement; return !!(a && a.matches && a.matches('input[type=text],textarea')); }
        let _pending = false;
        function softRender(){ if (typing()) { _pending = true; return; } render(); }
        document.addEventListener('focusout', () => setTimeout(() => { if (_pending && !typing()) { _pending = false; render(); } }, 80));

        // ───────── actions ─────────
        window.setView = v => { state.view = v; window.scrollTo(0, 0); render(); };
        window.openClass = c => { state.openClass = state.openClass === c ? '' : c; render(); };
        window.pickKid = id => { addMine(id); state.me = id; try{ localStorage.setItem('ptt_me', id); }catch(e){} state.view = 'kid'; window.scrollTo(0, 0); render(); };
        window.switchKid = () => { state.me = ''; try{ localStorage.removeItem('ptt_me'); }catch(e){} state.view = 'home'; window.scrollTo(0,0); render(); };
        window.forgetMine = (id, ev) => { if(ev) ev.stopPropagation(); if(!confirm('Remove this child from THIS device? Their missions and progress are kept — they just won\'t show in your list here.')) return; dropMine(id); if(state.me===id){ state.me=''; try{ localStorage.removeItem('ptt_me'); }catch(e){} } render(); };
        window.pickClass = (el) => { document.querySelectorAll('[data-cls]').forEach(x => x.classList.remove('ring-4')); el.classList.add('ring-4'); document.getElementById('jClass').value = el.dataset.cls; };
        window.addKid = () => {
            const nameEl = document.getElementById('jName'); const name = (nameEl?.value || '').trim();
            const cls = (document.getElementById('jClass')?.value || '').trim();
            if (!name) { alert('Please type the child’s name'); nameEl?.focus(); return; }
            if (!cls) { alert('Please tap a class'); return; }
            if (state.dbError) { alert('Not connected to the database yet, so this would not save. Check the internet and try again.'); return; }
            // Same name already in the same class → let the grown-up choose: use that child, or add a separate one
            const same = state.kids.find(k => (k.name || '').trim().toLowerCase() === name.toLowerCase() && k.cls === cls);
            if (same && !confirm(`${same.name} is already in ${cls}. Tap OK to use that child, or Cancel to add a new, separate child with the same name.`)) {
                // Cancel = add a new separate child → fall through
            } else if (same) {
                addMine(same.id); state.justAdded = [same.id, ...state.justAdded.filter(x => x !== same.id)];
                if (nameEl) nameEl.value = ''; showMessage(`👋 ${same.name} is on your list.`); setTimeout(() => document.getElementById('jName')?.focus(), 60); return;
            }
            const r = push(ref(db, ROOT + '/kids'), { name, cls, createdAt: Date.now() });
            addMine(r.key); state.justAdded = [r.key, ...state.justAdded];
            if (nameEl) nameEl.value = '';
            confetti(); showMessage(`🥚 ${name}'s turtle egg is ready!`);
            setTimeout(() => document.getElementById('jName')?.focus(), 60);
        };
        // Finish adding: one child → open it; several → go to Home where all of them show
        window.finishAdding = () => { const j = state.justAdded; state.justAdded = []; if (j.length === 1) pickKid(j[0]); else { state.view = 'home'; window.scrollTo(0,0); render(); } };
        window.doMission = (mid) => {
            const k = me(); if (!k || !M[mid]) return;
            const before = { stickers: stickersOf(k).map(s => s.id), grow: growFor(count(k)).label, total: total(), cls: classProgress(k.cls) };
            const entry = { m: mid, ts: Date.now() };
            const r = push(ref(db, `${ROOT}/kids/${k.id}/log`), entry);
            // work out what this tap unlocked (using the child's log plus the new entry)
            const after = { ...k, log: { ...(k.log || {}), [r.key]: entry } };
            const fresh = stickersOf(after).filter(s => !before.stickers.includes(s.id));
            const grow = growFor(count(after));
            const goal = +state.settings.goal || DEFAULTS.goal;
            confetti();
            if (before.total < goal && before.total + 1 >= goal) { confetti(); showMessage(`🎉🎉 We did it! Primary reached ${goal} missions — ${state.settings.reward}`); }
            else if (grow.label !== before.grow) showMessage(`${grow.e} ${k.name}'s turtle grew into a ${grow.label}!`);
            else if (fresh.length) showMessage(`${fresh[0].e} New sticker: ${fresh[0].label}!`);
            else showMessage(`${M[mid].e} Great job, ${k.name}! The ${k.cls} crew swims ahead!`);
        };
        window.undoLast = () => {
            const k = me(); if (!k) return; const l = logOf(k); if (!l.length) return;
            const last = l[l.length - 1];
            if (!confirm(`Take back the last mission? (${M[last.m] ? M[last.m].t : 'mission'})`)) return;
            remove(ref(db, `${ROOT}/kids/${k.id}/log/${last.id}`));
        };
        window.postStory = () => {
            const el = document.getElementById('storyText'); const text = (el.value || '').trim(); if (!text) return;
            const k = me(); const name = k ? k.name : (document.getElementById('storyName')?.value || '').trim();
            if (!name) { alert('Please add a name'); return; }
            push(ref(db, ROOT + '/stories'), { name, cls: k ? k.cls : '', text, ts: Date.now(), star: false });
            el.value = ''; showMessage('💬 Thank you for sharing your mission story!');
        };
        window.enterLeader = () => { const c = prompt('Enter the leader code:'); if (c === null) return; if (c.trim().toLowerCase() === LEADER_CODE) { state.leader = true; state.view = 'leader'; render(); } else showMessage('🔒 Wrong code'); };
        window.exitLeader = () => { state.leader = false; if (state.view === 'leader') state.view = 'home'; render(); };
        window.starStoryToggle = id => { if (!state.leader) return; const upd = {}; state.stories.forEach(s => { upd[`${s.id}/star`] = s.id === id ? !s.star : false; }); update(ref(db, ROOT + '/stories'), upd); };
        window.deleteStory = id => { if (!state.leader) return; if (confirm('Delete this story?')) remove(ref(db, `${ROOT}/stories/${id}`)); };
        window.removeKid = id => { if (!state.leader) return; const k = state.kids.find(x => x.id === id); if (!k) return; if (confirm(`Remove ${k.name}? This deletes their missions.`)) { remove(ref(db, `${ROOT}/kids/${id}`)); if (state.me === id) { state.me = ''; localStorage.removeItem('ptt_me'); } } };
        window.moveKid = (id, cls) => { if (!state.leader) return; update(ref(db, `${ROOT}/kids/${id}`), { cls }); };
        window.saveSettings = () => {
            if (!state.leader) return;
            const v = id => (document.getElementById(id)?.value || '').trim();
            update(ref(db, ROOT + '/settings'), { goal: Math.max(1, parseInt(v('sGoal')) || DEFAULTS.goal), reward: v('sReward') || DEFAULTS.reward, perChild: Math.max(1, parseInt(v('sPer')) || DEFAULTS.perChild), classes: v('sClasses') });
            showMessage('✓ Saved');
        };
        window.printQR = () => {
            const qr = document.getElementById('qrBox').innerHTML; const w = window.open('', '_blank');
            w.document.write(`<html><head><title>${APP_NAME}</title><style>body{font-family:sans-serif;text-align:center;padding:40px;}h1{color:#0e7490;}p{color:#555;font-size:18px;}</style></head><body><h1>🐢 ${APP_NAME}</h1><p>${WARD}</p><div style="display:inline-block;padding:20px;border:4px solid #f59e0b;border-radius:20px;margin:20px;">${qr}</div><p><strong>Scan to add your child!</strong></p><p style="font-size:14px;color:#888;">${PAGE_URL}#join</p></body></html>`);
            w.document.close(); setTimeout(() => w.print(), 400);
        };

        window.state = state;   // exposed for quick inspection
        // ───────── render ─────────
        function render() {
            const el = document.getElementById('app');
            if (!(state.loaded.kids && state.loaded.settings)) { el.innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-center"><div class="text-7xl mb-4 turtle">🐢</div><p class="text-xl font-black text-cyan-900">Loading ${APP_NAME}…</p></div></div>`; return; }
            const big = state.view === 'big';
            // keep anything half-typed (name, class, story, settings) when the page refreshes itself
            const keep = {}; el.querySelectorAll('[data-keep]').forEach(x => { keep[x.id] = x.value; });
            el.innerHTML = `
                <div class="min-h-screen ${big ? 'big' : ''}">
                    <div class="${big ? 'max-w-7xl' : 'max-w-5xl'} mx-auto p-3 md:p-6">
                        <div class="text-center pt-3 mb-4 cursor-pointer" onclick="setView('home')">
                            <div class="${big ? 'text-8xl' : 'text-6xl'} mb-1 floaty">🐢</div>
                            <h1 class="${big ? 'text-6xl' : 'text-4xl md:text-5xl'} font-extrabold text-cyan-900 leading-none">${APP_NAME}</h1>
                            <p class="${big ? 'text-2xl' : 'text-base md:text-lg'} font-bold text-cyan-700 mt-1">${WARD} · Love · Share · Invite</p>
                        </div>
                        ${state.dbError ? `<div class="mb-4 p-4 bg-rose-100 border-2 border-rose-300 text-rose-900 rounded-3xl font-bold text-center">⚠️ ${state.dbError === 'slow' ? 'Still connecting to the database… check the internet connection. Missions may not save yet.' : 'The database would not let this page in, so nothing can be saved yet. A leader needs to check the Firebase database rules.'}</div>` : ''}
                        ${state.message ? `<div class="mb-4 p-4 bg-emerald-500 text-white rounded-3xl font-black text-center text-lg shadow-xl pop">${esc(state.message)}</div>` : ''}
                        ${big ? `<div class="text-center mb-4"><button onclick="setView('home')" class="bg-white text-cyan-800 border-2 border-cyan-200 px-4 py-2 rounded-2xl font-black text-sm">✕ Close big screen</button></div>` : `
                        <div class="flex gap-2 justify-center mb-5 flex-wrap">
                            ${navBtn(me() ? 'kid' : 'home', me() ? '🐢 My Turtle' : '🏠 Home', state.view === 'home' || state.view === 'kid')}
                            ${navBtn('trail', '🏝️ Turtle Trail')}
                            ${navBtn('stories', '💬 Stories')}
                            ${navBtn('big', '📺 Big Screen')}

                    ${classes().map(c => `<div class="mb-4"><div class="font-black mb-2" style="color:${classTint(c)};">${classTurtle(c)} ${esc(c)} · ${classTotal(c)} missions</div>
                        <div class="grid sm:grid-cols-2 gap-2">${kidsIn(c).map(k => `<div class="flex items-center justify-between gap-2 bg-cyan-50 border border-cyan-100 rounded-2xl px-3 py-2">
                            <button onclick="pickKid('${k.id}')" class="font-black text-gray-800 text-sm text-left">${growFor(count(k)).e} ${esc(k.name)} <span class="font-bold text-gray-500">· ${count(k)} (${weekCount(k)} this wk)</span></button>
                            <span class="flex items-center gap-1"><select onchange="moveKid('${k.id}', this.value)" class="text-xs font-bold border border-cyan-200 rounded-lg px-1 py-1">${classes().map(x => `<option ${x === k.cls ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select><button onclick="removeKid('${k.id}')" title="Remove" class="text-red-500 border border-red-200 rounded-lg px-2 py-1">🗑️</button></span>
                        </div>`).join('') || '<span class="text-sm font-bold text-gray-400">No children yet.</span>'}</div></div>`).join('')}
                    ${state.kids.filter(k => !classes().includes(k.cls)).length ? `<div class="text-sm font-bold text-amber-700">⚠️ Some children are in a class that is no longer on the list: ${state.kids.filter(k => !classes().includes(k.cls)).map(k => `<button class="underline" onclick="pickKid('${k.id}')">${esc(k.name)} (${esc(k.cls)})</button>`).join(', ')}</div>` : ''}
                </div>
                <div class="text-center"><button onclick="setView('join')" class="bg-amber-500 text-white px-6 py-3 rounded-2xl font-black shadow-lg">📱 QR flyer for parents</button></div>
            </div>`;
        }

        render();
    </script>
</body>
</html>
