<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Challenge — Riverton 24th Tongan Ward</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-6px) rotate(1deg);} }
        @keyframes waveMove { 0%{background-position-x:0;} 100%{background-position-x:80px;} }
        @keyframes vroom { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-2px);} }
        @keyframes roadMove { 0%{background-position-x:0;} 100%{background-position-x:-60px;} }
        @keyframes waddle { 0%,100%{transform:rotate(-4deg);} 50%{transform:rotate(4deg);} }
        @keyframes grassMove { 0%{background-position-x:0;} 100%{background-position-x:-50px;} }
        @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
        @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0);opacity:1;} 100%{transform:translateY(100vh) rotate(720deg);opacity:0;} }
        @keyframes bgShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        @keyframes wiggle { 0%,100%{transform:rotate(0);} 25%{transform:rotate(-10deg) scale(1.1);} 75%{transform:rotate(10deg) scale(1.1);} }
        @keyframes floaty { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
        @keyframes wake { 0%{transform:scaleX(0.6);opacity:0.6;} 100%{transform:scaleX(1.3);opacity:0;} }

        /* living background — sits on body so it never restarts on re-render */
        body { background: linear-gradient(135deg,#e0f2fe,#dbeafe,#e0e7ff,#eff6ff,#f0f9ff); background-size: 400% 400%; animation: bgShift 20s ease infinite; }

        /* tactile press feedback on every button */
        button { transition: transform .12s cubic-bezier(0.34,1.6,0.64,1); }
        button:active { transform: scale(0.93); }

        .boat { animation: bob 3s ease-in-out infinite; }
        .car { animation: vroom 0.6s ease-in-out infinite; }
        .turtle { animation: waddle 1.5s ease-in-out infinite; }
        .floaty { animation: floaty 3s ease-in-out infinite; }

        /* door emoji wiggles when you hover its card */
        .door-emoji { transition: transform .3s; display:inline-block; }
        .hover-lift:hover .door-emoji { animation: wiggle .6s ease-in-out; }

        /* tappable team picker */
        .team-card { transition: all .18s cubic-bezier(0.34,1.6,0.64,1); }
        .team-card:hover { transform: translateY(-3px) scale(1.03); }
        .team-card:active { transform: scale(0.96); }
        .team-card.sel { transform: scale(1.05); box-shadow: 0 0 0 4px #f59e0b, 0 10px 24px rgba(0,0,0,0.18); }
        .team-emoji { display:inline-block; transition: transform .2s; }
        .team-card:hover .team-emoji { transform: scale(1.25) rotate(-8deg); }
        .team-card.sel .team-emoji { animation: wiggle .5s ease-in-out; }

        .track-boat { background: linear-gradient(180deg,#7dd3fc 0%,#38bdf8 40%,#0ea5e9 100%); position:relative; overflow:hidden; }
        .track-boat::after { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 8px, transparent 8px 40px); animation: waveMove 3s linear infinite; opacity:0.5; }

        .track-car { background: linear-gradient(180deg,#4b5563 0%,#374151 100%); position:relative; overflow:hidden; }
        .track-car::after { content:''; position:absolute; top:50%; left:0; right:0; height:4px; transform:translateY(-50%); background-image: repeating-linear-gradient(90deg, #fde047 0 24px, transparent 24px 48px); animation: roadMove 0.4s linear infinite; }

        .track-turtle { background: linear-gradient(180deg,#86efac 0%,#4ade80 50%,#22c55e 100%); position:relative; overflow:hidden; }
        .track-turtle::after { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.15) 0 6px, transparent 6px 30px); animation: grassMove 6s linear infinite; }

        .racer-track { transition: left 1.2s cubic-bezier(0.34,1.2,0.64,1); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.2); }
        .pop { animation: pop 0.4s ease-out; }
        .confetti-piece { position:fixed; top:0; width:10px; height:10px; z-index:9999; animation: confettiFall 2.5s linear forwards; }
        @media (max-width:768px){ .hover-lift:hover{transform:none;} }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>
    <div id="confetti"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, remove, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAmPDiDkM6Dq2BTmMExUy9KTD9XDDODgno",
            authDomain: "the-challenge-1bb53.firebaseapp.com",
            // IMPORTANT: databaseURL must match the Realtime Database you create in the
            // Firebase console. The line below is the US-region default. If your database
            // shows a different URL in the console (e.g. ...europe-west1.firebasedatabase.app),
            // replace this with the exact URL shown there.
            databaseURL: "https://the-challenge-1bb53-default-rtdb.firebaseio.com",
            projectId: "the-challenge-1bb53",
            storageBucket: "the-challenge-1bb53.firebasestorage.app",
            messagingSenderId: "660247853699",
            appId: "1:660247853699:web:cd57840a30934e898879b6"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Each challenge has its own independent enrollment list
        const REFS = {
            '21':   ref(db, 'theChallenge/enroll_21'),
            'bom':  ref(db, 'theChallenge/enroll_bom'),
            'read': ref(db, 'theChallenge/enroll_read')
        };
        const wallRef = ref(db, 'theChallenge/wall');
        const settingsRef = ref(db, 'theChallenge/settings');

        const CHALLENGE_DAYS = 21;
        // Hard-pinned so QR codes / flyer links always use the exact (case-sensitive) URL,
        // no matter how someone arrived. Keep the trailing slash.
        const PAGE_URL = 'https://filipefa1998-sudo.github.io/The-Challenge/';
        const LEADER_CODE = 'riverton24'; // change to your own leader passcode
        const HANDOUT_GOAL_DEFAULT = 100;

        const ORGANIZATIONS = ['Elders Quorum','Relief Society','Young Men','Young Women','Primary','Sunday School','Young Single Adult'];

        // Stake year-end reading deadline (used for countdown on Read challenge)
        const READ_DEADLINE = new Date(new Date().getFullYear(), 11, 31, 23, 59, 59); // Dec 31

        // Daily verses — one shows on the home screen, rotating by day of year
        const DAILY_VERSES = [
            { ref:'1 Nephi 3:7', text:'I will go and do the things which the Lord hath commanded.' },
            { ref:'2 Nephi 2:25', text:'Adam fell that men might be; and men are, that they might have joy.' },
            { ref:'2 Nephi 31:20', text:'Press forward with a steadfastness in Christ, having a perfect brightness of hope.' },
            { ref:'Mosiah 2:17', text:'When ye are in the service of your fellow beings ye are only in the service of your God.' },
            { ref:'Mosiah 3:19', text:'Become as a child, submissive, meek, humble, patient, full of love.' },
            { ref:'Alma 32:21', text:'Faith is not to have a perfect knowledge; it is to hope for things which are not seen, which are true.' },
            { ref:'Alma 37:6', text:'By small and simple things are great things brought to pass.' },
            { ref:'Ether 12:27', text:'My grace is sufficient... I give unto men weakness that they may be humble.' },
            { ref:'Moroni 7:45', text:'Charity suffereth long, and is kind, and envieth not.' },
            { ref:'Moroni 10:4', text:'Ask God... if these things are not true; and he will manifest the truth of it unto you.' },
            { ref:'3 Nephi 5:13', text:'Behold, I am a disciple of Jesus Christ, the Son of God.' },
            { ref:'Helaman 5:12', text:'Build your foundation upon the rock of our Redeemer, who is Christ.' },
            { ref:'2 Nephi 32:3', text:'Feast upon the words of Christ; for the words of Christ will tell you all things what ye should do.' },
            { ref:'Alma 34:32', text:'This life is the time for men to prepare to meet God.' }
        ];
        function verseOfDay() {
            const start = new Date(new Date().getFullYear(),0,0);
            const day = Math.floor((new Date()-start)/86400000);
            return DAILY_VERSES[day % DAILY_VERSES.length];
        }

        // Badge definitions per challenge
        const BADGES = {
            '21': [
                { id:'wk1', emoji:'🌱', label:'First Week', test:p=>daysDone(p)>=7 },
                { id:'perfect', emoji:'⭐', label:'Perfect Week', test:p=>streak(p)>=7 },
                { id:'wk2', emoji:'🌿', label:'Two Weeks', test:p=>daysDone(p)>=14 },
                { id:'finisher', emoji:'🏁', label:'21-Day Finisher', test:p=>daysDone(p)>=CHALLENGE_DAYS }
            ],
            'bom': [
                { id:'first', emoji:'🌱', label:'First Copy', test:p=>(p.handouts||0)>=1 },
                { id:'miss5', emoji:'📕', label:'Missionary (5)', test:p=>(p.handouts||0)>=5 },
                { id:'miss10', emoji:'🔥', label:'On Fire (10)', test:p=>(p.handouts||0)>=10 },
                { id:'champ', emoji:'👑', label:'Hand-Out Champion (25)', test:p=>(p.handouts||0)>=25 }
            ],
            'read': [
                { id:'start', emoji:'🌱', label:'Started', test:p=>(p.chaptersRead||0)>=1 },
                { id:'nephi', emoji:'📗', label:'Through 2 Nephi', test:p=>(p.chaptersRead||0)>=55 },
                { id:'half', emoji:'📖', label:'Halfway', test:p=>(p.chaptersRead||0)>=TOTAL_CHAPTERS/2 },
                { id:'champ', emoji:'👑', label:'Scripture Champion', test:p=>(p.chaptersRead||0)>=TOTAL_CHAPTERS }
            ]
        };

        // Teams — 7 per challenge, each with an emoji and a playful theme.
        // A person joins each challenge independently, so teams don't overlap between
        // challenges. Move a team to a different challenge by moving its line between the
        // three arrays below (keep 7 in each). teamEmoji/teamTheme look up across all.
        const TEAMS_21 = [
            { name:'Hungry Horses',       emoji:'🐴', theme:'always asking, "What are we eating?"' },
            { name:'Gout Masters',        emoji:'🦶', theme:'the official foot squad 😂' },
            { name:'Island Time Turtles', emoji:'🐢', theme:'never early, never in a hurry' },
            { name:'BBQ Bears',           emoji:'🐻', theme:'protect the grill at all costs' },
            { name:'Kava Koalas',         emoji:'🐨', theme:'permanently relaxed' },
            { name:'Talanoa Toucans',     emoji:'🦜', theme:'somehow every conversation lasts 2 hours' },
            { name:'Maloha Monkeys',      emoji:'🐒', theme:'maximum energy, minimum planning' }
        ];
        const TEAMS_BOM = [
            { name:'Big Belly Buffalo',   emoji:'🦬', theme:'built for the buffet' },
            { name:'Sunday Sloths',       emoji:'🦥', theme:'"We\'ll do it after church."' },
            { name:'Makai Meerkats',      emoji:'🐿️', theme:'always looking around to see what\'s happening' },
            { name:'Big Island Elephants',emoji:'🐘', theme:'big presence, bigger appetite' },
            { name:'Late Roosters',       emoji:'🐓', theme:'supposed to wake everybody up… at noon 😂' },
            { name:'Sideways Crabs',      emoji:'🦀', theme:'taking the scenic route everywhere' },
            { name:'Buffet Hippos',       emoji:'🦛', theme:'no plate left behind' }
        ];
        const TEAMS_READ = [
            { name:'Stubborn Goats',      emoji:'🐐', theme:'"Nope. We\'re doing it this way."' },
            { name:'Fefe Whales',         emoji:'🐋', theme:'massive splash, massive personality' },
            { name:'Coconut Geckos',      emoji:'🦎', theme:'somehow everywhere at once' },
            { name:'Lazy Lions',          emoji:'🦁', theme:'kings of the couch' },
            { name:'Makai Pigs',          emoji:'🐷', theme:'food disappears mysteriously' },
            { name:'Eagle Eyes',          emoji:'🦅', theme:'sees everything happening 😂' },
            { name:'Slow Mo Snails',      emoji:'🐌', theme:'"We\'re on our way!" …30 minutes later' }
        ];
        const ALL_TEAMS = [...TEAMS_21, ...TEAMS_BOM, ...TEAMS_READ];
        const teamEmoji = (name) => { const t = ALL_TEAMS.find(x => x.name === name); return t ? t.emoji : '🏳️'; };
        const teamTheme = (name) => { const t = ALL_TEAMS.find(x => x.name === name); return t ? t.theme : ''; };

        // Challenge definitions — the heart of the three-door hub
        const CHALLENGES = {
            '21': {
                key:'21', tag:'21', title:'21-Day Reading Streak', short:'21-Day',
                emoji:'📅', racer:'⛵', raceName:'Boat Race', track:'track-boat', racerAnim:'boat',
                grad:'from-blue-500 to-sky-600', text:'text-blue-700', bg:'bg-blue-50', border:'border-blue-200',
                desc:'Read every day for 21 days straight. Keep the streak alive!',
                teams: TEAMS_21.map(t=>t.name),
                // racer upgrades by team progress (0..1): raft → sailboat → ship
                tiers: [ {min:0,e:'🛶'}, {min:0.34,e:'⛵'}, {min:0.67,e:'🚢'} ]
            },
            'bom': {
                key:'bom', tag:'BOM', title:'Book of Mormon Hand-Out', short:'BOM Hand-Out',
                emoji:'📕', racer:'🚗', raceName:'Car Race', track:'track-car', racerAnim:'car',
                grad:'from-amber-500 to-orange-600', text:'text-amber-700', bg:'bg-amber-50', border:'border-amber-200',
                desc:'Hand out copies of the Book of Mormon. Every copy moves your car forward!',
                teams: TEAMS_BOM.map(t=>t.name),
                // scooter → sedan → race car
                tiers: [ {min:0,e:'🛵'}, {min:0.34,e:'🚗'}, {min:0.67,e:'🏎️'} ]
            },
            'read': {
                key:'read', tag:'Read', title:'Read the Book of Mormon', short:'Read the BOM',
                emoji:'📖', racer:'🐢', raceName:'Turtle Race', track:'track-turtle', racerAnim:'turtle',
                grad:'from-green-500 to-emerald-600', text:'text-green-700', bg:'bg-green-50', border:'border-green-200',
                desc:'Read all 239 chapters, 1 Nephi to Moroni. Slow and steady finishes the race!',
                teams: TEAMS_READ.map(t=>t.name),
                // hatchling → turtle → big tortoise
                tiers: [ {min:0,e:'🥚'}, {min:0.34,e:'🐢'}, {min:0.67,e:'🐉'} ]
            }
        };

        const TEAM_TINT = ['#ef4444','#3b82f6','#22c55e','#a855f7','#f59e0b','#ec4899','#14b8a6','#6366f1'];

        const BOM_BOOKS = [
            {name:'1 Nephi',ch:22},{name:'2 Nephi',ch:33},{name:'Jacob',ch:7},{name:'Enos',ch:1},
            {name:'Jarom',ch:1},{name:'Omni',ch:1},{name:'W of Mormon',ch:1},{name:'Mosiah',ch:29},
            {name:'Alma',ch:63},{name:'Helaman',ch:16},{name:'3 Nephi',ch:30},{name:'4 Nephi',ch:1},
            {name:'Mormon',ch:9},{name:'Ether',ch:15},{name:'Moroni',ch:10}
        ];
        const TOTAL_CHAPTERS = BOM_BOOKS.reduce((s,b)=>s+b.ch,0);

        let state = {
            data: { '21':[], 'bom':[], 'read':[] },
            wall: [],
            settings: { handoutGoal: HANDOUT_GOAL_DEFAULT },
            loaded: { '21':false, 'bom':false, 'read':false },
            me: JSON.parse(localStorage.getItem('tc_me2') || '{}'), // {21:id, bom:id, read:id}
            view: 'home',       // home | c/<key> | join/<key> | wall
            leader: false,
            message: ''
        };
        // QR deep-link: #join-21, #join-bom, #join-read
        const h = window.location.hash;
        if (h.startsWith('#join-')) { const k=h.replace('#join-',''); if(CHALLENGES[k]) state.view='join/'+k; }

        Object.keys(REFS).forEach(k=>{
            onValue(REFS[k], snap=>{
                const d = snap.val();
                state.data[k] = d ? Object.keys(d).map(id=>({id, ...d[id]})) : [];
                state.loaded[k] = true;
                render();
            });
        });
        onValue(wallRef, snap=>{
            const d = snap.val();
            state.wall = d ? Object.keys(d).map(id=>({id,...d[id]})).sort((a,b)=>(b.ts||0)-(a.ts||0)) : [];
            render();
        });
        onValue(settingsRef, snap=>{ const d=snap.val(); if(d) state.settings={...state.settings,...d}; render(); });

        // ---------- helpers ----------
        const allLoaded = () => state.loaded['21'] && state.loaded['bom'] && state.loaded['read'];
        const enrollment = (ck) => { const id=state.me[ck]; return id ? state.data[ck].find(p=>p.id===id) : null; };
        const daysDone = p => (p.days||[]).filter(Boolean).length;
        const teamMembers = (ck, team) => state.data[ck].filter(p=>p.team===team);
        const activeTeams = (ck) => CHALLENGES[ck].teams.map((t,i)=>({team:t,idx:i,members:teamMembers(ck,t)})).filter(x=>x.members.length>0);

        function streak(p){ const days=p.days||[]; let best=0,run=0; for(const d of days){ if(d){run++;best=Math.max(best,run);} else run=0; } return best; }

        // Per-challenge progress metric for a person (0..1) and a display value
        function personProgress(ck, p) {
            if (ck==='21') return daysDone(p)/CHALLENGE_DAYS;
            if (ck==='read') return (p.chaptersRead||0)/TOTAL_CHAPTERS;
            if (ck==='bom') return Math.min(1, (p.handouts||0)/25); // 25 = "full tank" for race position
            return 0;
        }
        function personValue(ck, p) {
            if (ck==='21') return daysDone(p)+'/21';
            if (ck==='read') return (p.chaptersRead||0)+' ch';
            if (ck==='bom') return (p.handouts||0)+' out';
            return '';
        }
        function teamProgress(ck, team) {
            const m = teamMembers(ck, team);
            if (!m.length) return 0;
            return m.reduce((s,p)=>s+personProgress(ck,p),0)/m.length;
        }
        const totalHandouts = () => state.data['bom'].reduce((s,p)=>s+(p.handouts||0),0);

        // racer emoji for a team's current progress tier
        function racerFor(ck, prog) {
            const tiers = CHALLENGES[ck].tiers;
            let e = tiers[0].e;
            for (const t of tiers) if (prog >= t.min) e = t.e;
            return e;
        }
        // badges a person has earned in a challenge
        function earnedBadges(ck, p) { return (BADGES[ck]||[]).filter(b=>b.test(p)); }
        function daysLeftToDeadline() {
            const ms = READ_DEADLINE - new Date();
            return Math.max(0, Math.ceil(ms/86400000));
        }

        function confetti(){ const c=document.getElementById('confetti'); const cols=['#f59e0b','#ef4444','#3b82f6','#10b981','#8b5cf6','#ec4899']; for(let i=0;i<50;i++){ const el=document.createElement('div'); el.className='confetti-piece'; el.style.left=Math.random()*100+'%'; el.style.background=cols[Math.floor(Math.random()*cols.length)]; el.style.animationDelay=Math.random()*0.5+'s'; el.style.borderRadius=Math.random()>0.5?'50%':'0'; c.appendChild(el); setTimeout(()=>el.remove(),3000);} }
        function showMessage(m){ state.message=m; render(); setTimeout(()=>{state.message='';render();},3000); }

        // Detect newly earned badges + team milestones, celebrate them.
        // beforeProg/afterProg are the team's progress before and after the update.
        function celebrate(ck, p, beforeSeen, beforeTeamProg) {
            const earned = earnedBadges(ck, p).map(b=>b.id);
            const fresh = earned.filter(id=>!(beforeSeen||[]).includes(id));
            if (fresh.length) {
                update(ref(db,`theChallenge/enroll_${ck}/${p.id}`), { seenBadges: earned });
                const b = (BADGES[ck]||[]).find(x=>x.id===fresh[0]);
                confetti();
                showMessage(`${b.emoji} Badge earned: ${b.label}!`);
                return;
            }
            // team milestone callout at 25 / 50 / 75 / 100%
            const after = teamProgress(ck, p.team);
            const marks = [0.25,0.5,0.75,1];
            const crossed = marks.find(m => beforeTeamProg < m && after >= m);
            if (crossed) { confetti(); showMessage(`🎉 ${p.team} reached ${Math.round(crossed*100)}%!`); }
        }

        // ---------- actions ----------
        window.setView = v => { state.view=v; window.scrollTo(0,0); render(); };

        window.joinChallenge = (ck) => {
            const name = document.getElementById('jName').value.trim();
            const org = document.getElementById('jOrg').value;
            const team = document.getElementById('jTeam').value;
            if(!name){ alert('Please enter your name'); return; }
            if(!team){ alert('Please pick a team'); return; }
            const id = 'p_'+Date.now();
            const base = { name, org, team, createdAt:new Date().toISOString() };
            if (ck==='21') Object.assign(base, { days:Array(CHALLENGE_DAYS).fill(false), startDate:new Date().toISOString().split('T')[0], completedDate:null });
            if (ck==='bom') Object.assign(base, { handouts:0 });
            if (ck==='read') Object.assign(base, { chaptersRead:0 });
            set(ref(db, `theChallenge/enroll_${ck}/${id}`), base).then(()=>{
                state.me[ck]=id; localStorage.setItem('tc_me2', JSON.stringify(state.me));
                state.view='c/'+ck; confetti(); showMessage(`🎉 You joined ${CHALLENGES[ck].short} on ${team}!`);
            });
        };
        // team picker in the join form — DOM-only so the typed name isn't wiped by a re-render
        window.selectTeam = (el, team) => {
            document.querySelectorAll('[data-teamcard]').forEach(x=>x.classList.remove('sel'));
            el.classList.add('sel');
            const inp = document.getElementById('jTeam'); if(inp) inp.value = team;
        };
        window.pickMe = (ck, id) => { state.me[ck]=id; localStorage.setItem('tc_me2',JSON.stringify(state.me)); state.view='c/'+ck; render(); };
        window.leaveEnrollment = (ck) => { delete state.me[ck]; localStorage.setItem('tc_me2',JSON.stringify(state.me)); render(); };

        // 21-day
        window.toggleDay = (ck, dayIdx) => {
            const p=enrollment(ck); if(!p) return;
            const days=[...(p.days||Array(CHALLENGE_DAYS).fill(false))]; days[dayIdx]=!days[dayIdx];
            const count=days.filter(Boolean).length;
            const completedDate = count>=CHALLENGE_DAYS ? (p.completedDate||new Date().toISOString().split('T')[0]) : null;
            update(ref(db,`theChallenge/enroll_${ck}/${p.id}`), {days, completedDate});
        };
        window.checkToday = (ck) => {
            const p=enrollment(ck); if(!p) return;
            const beforeSeen=p.seenBadges||[]; const beforeTeam=teamProgress(ck,p.team);
            const days=[...(p.days||Array(CHALLENGE_DAYS).fill(false))];
            const next=days.findIndex(d=>!d);
            if(next===-1){ showMessage('🏁 All 21 days already done!'); return; }
            days[next]=true; const count=days.filter(Boolean).length;
            const completedDate = count>=CHALLENGE_DAYS ? (p.completedDate||new Date().toISOString().split('T')[0]) : null;
            update(ref(db,`theChallenge/enroll_${ck}/${p.id}`), {days, completedDate}).then(()=>{ confetti(); celebrate(ck, {...p,days}, beforeSeen, beforeTeam); });
        };
        // bom
        window.addHandout = (n) => { const p=enrollment('bom'); if(!p) return; const beforeSeen=p.seenBadges||[]; const beforeTeam=teamProgress('bom',p.team); const handouts=Math.max(0,(p.handouts||0)+n); update(ref(db,`theChallenge/enroll_bom/${p.id}`),{handouts}).then(()=>{ if(n>0){ confetti(); celebrate('bom', {...p,handouts}, beforeSeen, beforeTeam); } }); };
        // read
        window.adjustChapters = (n) => { const p=enrollment('read'); if(!p) return; const beforeSeen=p.seenBadges||[]; const beforeTeam=teamProgress('read',p.team); const chaptersRead=Math.min(TOTAL_CHAPTERS,Math.max(0,(p.chaptersRead||0)+n)); update(ref(db,`theChallenge/enroll_read/${p.id}`),{chaptersRead}).then(()=>{ if(n>0){ confetti(); celebrate('read', {...p,chaptersRead}, beforeSeen, beforeTeam); } }); };
        window.setChapters = (val) => { const p=enrollment('read'); if(!p) return; const chaptersRead=Math.min(TOTAL_CHAPTERS,Math.max(0,parseInt(val)||0)); update(ref(db,`theChallenge/enroll_read/${p.id}`),{chaptersRead}); };

        // wall
        window.postToWall = () => {
            const text=document.getElementById('wallText').value.trim();
            const ck=document.getElementById('wallChallenge').value;
            if(!text) return;
            // find any enrollment for name/team
            const p = enrollment(ck) || enrollment('21') || enrollment('bom') || enrollment('read');
            if(!p){ alert('Join a challenge first to post.'); return; }
            push(wallRef, { name:p.name, team:p.team, ck, text, ts:Date.now(), shoutout:false })
                .then(()=>{ document.getElementById('wallText').value=''; showMessage('💬 Posted!'); });
        };
        window.deletePost = (id) => { if(!state.leader && !confirm('Delete this post?')) return; remove(ref(db,`theChallenge/wall/${id}`)); };
        window.toggleShoutout = (id) => { if(!state.leader) return; const post=state.wall.find(w=>w.id===id); update(ref(db,`theChallenge/wall/${id}`),{shoutout:!post.shoutout}); };

        // leader
        window.enterLeader = () => { const c=prompt('Enter leader code:'); if(c===LEADER_CODE){state.leader=true;render();showMessage('🔑 Leader mode on — tap 🗑️ on any name to remove.');} else if(c!==null) showMessage('Incorrect code.'); };
        window.exitLeader = () => { state.leader=false; render(); };
        // Anyone can remove an entry (fixes accidental / wrong-challenge joins). Confirm guards taps.
        window.removePerson = (ck,id) => { const p=state.data[ck].find(x=>x.id===id); if(!p) return; if(confirm(`Remove ${p.name} from ${CHALLENGES[ck].short}? This deletes their progress.`)){ remove(ref(db,`theChallenge/enroll_${ck}/${id}`)); if(state.me[ck]===id){ delete state.me[ck]; localStorage.setItem('tc_me2',JSON.stringify(state.me)); } showMessage(`Removed ${p.name}.`); } };
        // self-remove: delete my own enrollment from the database (handy for testing)
        window.removeMe = (ck) => { const p=enrollment(ck); if(!p) return; if(confirm(`Remove ${p.name} from ${CHALLENGES[ck].short}? This deletes their progress.`)){ remove(ref(db,`theChallenge/enroll_${ck}/${p.id}`)); delete state.me[ck]; localStorage.setItem('tc_me2',JSON.stringify(state.me)); showMessage('Removed.'); } };
        window.setGoal = () => { if(!state.leader) return; const g=prompt('Ward hand-out goal:', state.settings.handoutGoal); if(g) update(settingsRef,{handoutGoal:parseInt(g)||HANDOUT_GOAL_DEFAULT}); };

        window.printQR = (ck) => {
            const qr=document.getElementById('qrBox').innerHTML;
            const c=CHALLENGES[ck];
            const w=window.open('','_blank');
            w.document.write(`<html><head><title>${c.short} QR</title><style>body{font-family:sans-serif;text-align:center;padding:40px;}h1{color:#1e3a5f;}p{color:#555;font-size:18px;}</style></head><body><h1>${c.emoji} ${c.title}</h1><p>Riverton 24th Tongan Ward</p><div style="display:inline-block;padding:20px;border:4px solid #d97706;border-radius:20px;margin:20px;">${qr}</div><p><strong>Scan to join!</strong></p><p style="font-size:14px;color:#888;">${PAGE_URL}#join-${ck}</p></body></html>`);
            w.document.close(); setTimeout(()=>w.print(),400);
        };

        // ---------- render ----------
        function render() {
            const el=document.getElementById('app');
            if(!allLoaded()){ el.innerHTML=`<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-100 to-blue-200"><div class="text-center"><div class="text-6xl mb-4">📖</div><p class="text-xl font-bold text-blue-900">Loading The Challenge...</p></div></div>`; return; }
            el.innerHTML = `
                <div class="min-h-screen">
                    <div class="max-w-6xl mx-auto p-3 md:p-6">
                        <div class="text-center pt-4 mb-5 cursor-pointer" onclick="setView('home')">
                            <div class="text-5xl md:text-7xl mb-2 floaty">🏁</div>
                            <h1 class="text-3xl md:text-5xl font-black text-blue-900">The Challenge</h1>
                            <p class="text-lg md:text-2xl font-bold text-blue-700">Riverton 24th Tongan Ward</p>
                        </div>
                        ${state.message?`<div class="mb-4 p-4 bg-green-500 text-white rounded-2xl font-bold text-center shadow-xl pop">${state.message}</div>`:''}
                        <div class="flex gap-2 justify-center mb-6 flex-wrap">
                            ${navBtn('home','🏠 Home')}
                            ${navBtn('wall','💬 Wall')}
                            <button onclick="${state.leader?'exitLeader()':'enterLeader()'}" class="px-5 py-2.5 rounded-xl font-black text-sm md:text-base transition-all hover-lift border-2 ${state.leader?'bg-gradient-to-r from-amber-500 to-amber-600 text-white border-amber-700':'bg-white text-amber-700 border-amber-200 hover:bg-amber-50'} shadow">${state.leader?'🔑 Leader ✓':'🔑 Leader'}</button>
                        </div>
                        ${state.leader?`<div class="text-center mb-4 -mt-2"><span class="inline-block bg-amber-100 text-amber-800 text-xs font-bold px-4 py-1.5 rounded-full border border-amber-300">🔑 Leader mode on — open any challenge and tap 🗑️ next to a name to remove them</span></div>`:''}
                        ${renderView()}
                        <div class="text-center mt-8 pb-6 text-sm text-blue-400">
                            Riverton 24th Tongan Ward · The Challenge 🏁
                        </div>
                    </div>
                </div>`;
            if(state.view.startsWith('join/')) renderQRCode(state.view.split('/')[1]);
        }
        function navBtn(v,label){ const on=state.view===v; return `<button onclick="setView('${v}')" class="px-5 py-2.5 rounded-xl font-black text-sm md:text-base transition-all hover-lift border-2 ${on?'bg-gradient-to-r from-blue-600 to-sky-600 text-white border-blue-800':'bg-white text-blue-800 border-blue-200 hover:bg-blue-50'} shadow">${label}</button>`; }

        function renderView() {
            if(state.view==='home') return renderHome();
            if(state.view==='wall') return renderWall();
            if(state.view.startsWith('c/')) return renderChallenge(state.view.split('/')[1]);
            if(state.view.startsWith('join/')) return renderJoin(state.view.split('/')[1]);
            return renderHome();
        }

        function renderHome() {
            const v = verseOfDay();
            return `
                <div class="bg-gradient-to-r from-indigo-600 via-blue-600 to-sky-600 text-white rounded-3xl shadow-xl p-6 mb-6 text-center">
                    <div class="text-xs font-black uppercase tracking-wider opacity-80 mb-2">📖 Verse of the Day</div>
                    <p class="text-lg md:text-xl italic font-semibold leading-relaxed">"${v.text}"</p>
                    <p class="text-sm font-bold opacity-90 mt-2">— ${v.ref}</p>
                </div>
                <div class="grid md:grid-cols-3 gap-5 mb-6">
                    ${Object.values(CHALLENGES).map(c=>{
                        const count=state.data[c.key].length;
                        const mine=enrollment(c.key);
                        return `<div class="bg-white rounded-3xl shadow-xl p-6 border-2 ${c.border} hover-lift cursor-pointer flex flex-col" onclick="setView('c/${c.key}')">
                            <div class="flex items-center justify-between mb-2">
                                <div class="text-5xl door-emoji">${c.emoji}</div>
                                <span class="bg-gradient-to-r ${c.grad} text-white px-3 py-1 rounded-full text-sm font-black">${c.tag}</span>
                            </div>
                            <h3 class="text-xl font-black ${c.text} mb-1">${c.title}</h3>
                            <p class="text-sm text-gray-500 font-semibold flex-1">${c.desc}</p>
                            ${c.key==='read'?`<div class="mt-2 text-xs font-black text-green-700 bg-green-50 rounded-lg px-3 py-1.5 inline-block">⏳ ${daysLeftToDeadline()} days left with the Stake</div>`:''}
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-xs font-bold text-gray-400">${count} racing · ${c.racer} ${c.raceName}</span>
                                ${mine?`<span class="text-xs font-black ${c.text}">✓ You're in</span>`:''}
                            </div>
                            <button class="mt-3 w-full bg-gradient-to-r ${c.grad} text-white py-2.5 rounded-xl font-black hover:opacity-90 transition-all">${mine?'Open →':'Enter →'}</button>
                        </div>`;
                    }).join('')}
                </div>
                <div class="bg-white rounded-3xl shadow-xl p-6 text-center">
                    <p class="text-blue-800 font-bold text-lg">🏁 Three challenges, three races. Join one, two, or all three!</p>
                    <p class="text-blue-500 text-sm mt-1">Each challenge has its own teams and its own race to the finish.</p>
                </div>`;
        }

        function renderChallenge(ck) {
            const c=CHALLENGES[ck];
            const mine=enrollment(ck);
            return `
                <div class="mb-5 flex items-center gap-3 flex-wrap">
                    <button onclick="setView('home')" class="bg-white text-blue-700 px-4 py-2 rounded-xl font-bold border-2 border-blue-200 hover:bg-blue-50">← Home</button>
                    <span class="bg-gradient-to-r ${c.grad} text-white px-4 py-2 rounded-full font-black">${c.tag} · ${c.title}</span>
                    ${mine ? `<button onclick="setView('join/${ck}')" class="bg-amber-100 text-amber-800 px-4 py-2 rounded-xl font-bold border-2 border-amber-200 hover:bg-amber-200">📱 QR</button>`
                           : `<button onclick="setView('join/${ck}')" class="bg-gradient-to-r from-amber-600 to-amber-700 text-white px-4 py-2 rounded-xl font-black">➕ Join</button>`}
                </div>
                ${mine ? renderMyPanel(ck, mine) : renderJoinNudge(ck)}
                ${renderRace(ck)}
                ${renderLeaderboard(ck)}
                ${renderRoster(ck)}
            `;
        }

        function renderJoinNudge(ck) {
            const c=CHALLENGES[ck];
            const others = state.data[ck];
            return `<div class="bg-white rounded-3xl shadow-xl p-6 mb-6 text-center border-2 ${c.border}">
                <div class="text-5xl mb-2">${c.racer}</div>
                <p class="text-xl font-black ${c.text} mb-3">You're not in ${c.short} yet</p>
                <button onclick="setView('join/${ck}')" class="bg-gradient-to-r ${c.grad} text-white px-8 py-3 rounded-xl font-black hover:opacity-90 transition-all shadow-lg">Join this challenge →</button>
                ${others.length?`<div class="mt-5"><p class="text-sm text-gray-500 mb-2">Already joined? Tap your name:</p><div class="flex flex-wrap gap-2 justify-center">${others.slice(0,40).map(p=>`<button onclick="pickMe('${ck}','${p.id}')" class="${c.bg} ${c.text} px-3 py-1.5 rounded-lg text-sm font-semibold hover:opacity-80 border-2 ${c.border}">${p.name}</button>`).join('')}</div></div>`:''}
            </div>`;
        }

        function renderMyPanel(ck, p) {
            const c=CHALLENGES[ck];
            if (ck==='21') {
                const done=daysDone(p), st=streak(p), next=(p.days||[]).findIndex(d=>!d);
                return `<div class="bg-white rounded-3xl shadow-xl p-6 mb-6 border-2 ${c.border}">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                        <div><h3 class="text-2xl font-black ${c.text}">Ahoy, ${p.name}! ⛵</h3><p class="text-gray-500 font-semibold">${teamEmoji(p.team)} ${p.team} · ${p.org||'—'}</p></div>
                        <div class="text-center bg-blue-50 rounded-2xl px-5 py-2"><div class="text-3xl font-black text-blue-700">🔥 ${st}</div><div class="text-xs text-blue-500">streak</div></div>
                    </div>
                    ${done>=CHALLENGE_DAYS?`<div class="text-center py-3"><div class="text-4xl">🏁</div><p class="text-xl font-black text-green-700">All 21 days done! Finished ${p.completedDate?new Date(p.completedDate).toLocaleDateString():''}</p></div>`
                    :`<div class="text-center mb-4"><button onclick="checkToday('21')" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-10 py-4 rounded-2xl font-black text-xl hover:opacity-90 shadow-lg hover-lift">✓ Check In (Day ${next+1})</button></div>`}
                    <div class="grid grid-cols-7 gap-2">
                        ${Array.from({length:CHALLENGE_DAYS},(_,d)=>{const ch=(p.days||[])[d];return `<button onclick="toggleDay('21',${d})" class="aspect-square rounded-xl text-sm font-black flex items-center justify-center transition-all ${ch?'bg-gradient-to-br from-blue-500 to-sky-600 text-white shadow-md':'bg-gray-100 text-gray-400 border-2 border-gray-200 hover:border-gray-400'}">${ch?'✓':d+1}</button>`;}).join('')}
                    </div>
                    ${renderBadgeStrip('21',p)}
                    <div class="mt-4 flex gap-4"><button onclick="leaveEnrollment('21')" class="text-xs text-gray-400 underline">not you? switch</button><button onclick="removeMe('21')" class="text-xs text-red-400 underline">remove me</button></div>
                </div>`;
            }
            if (ck==='bom') {
                return `<div class="bg-white rounded-3xl shadow-xl p-6 mb-6 border-2 ${c.border}">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                        <div><h3 class="text-2xl font-black ${c.text}">Vroom, ${p.name}! 🚗</h3><p class="text-gray-500 font-semibold">${teamEmoji(p.team)} ${p.team} · ${p.org||'—'}</p></div>
                        <div class="text-center bg-amber-50 rounded-2xl px-5 py-2"><div class="text-3xl font-black text-amber-700">${p.handouts||0}</div><div class="text-xs text-amber-500">handed out</div></div>
                    </div>
                    <div class="flex items-center gap-2 justify-center flex-wrap">
                        <button onclick="addHandout(-1)" class="bg-gray-200 text-gray-700 w-12 h-12 rounded-xl font-black text-xl hover:bg-gray-300">−</button>
                        <button onclick="addHandout(1)" class="bg-gradient-to-r from-amber-600 to-orange-600 text-white px-8 h-12 rounded-xl font-black text-lg hover:opacity-90">+1 handed out 🙌</button>
                    </div>
                    ${renderBadgeStrip('bom',p)}
                    <div class="mt-4 flex gap-4"><button onclick="leaveEnrollment('bom')" class="text-xs text-gray-400 underline">not you? switch</button><button onclick="removeMe('bom')" class="text-xs text-red-400 underline">remove me</button></div>
                </div>`;
            }
            if (ck==='read') {
                const pct=Math.round((p.chaptersRead||0)/TOTAL_CHAPTERS*100);
                const left=daysLeftToDeadline();
                const remaining=TOTAL_CHAPTERS-(p.chaptersRead||0);
                const perDay = left>0 ? (remaining/left).toFixed(1) : remaining;
                return `<div class="bg-white rounded-3xl shadow-xl p-6 mb-6 border-2 ${c.border}">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
                        <div><h3 class="text-2xl font-black ${c.text}">Steady, ${p.name}! 🐢</h3><p class="text-gray-500 font-semibold">${teamEmoji(p.team)} ${p.team} · ${p.org||'—'}</p></div>
                        <div class="text-center bg-green-50 rounded-2xl px-5 py-2"><div class="text-3xl font-black text-green-700">${p.chaptersRead||0}</div><div class="text-xs text-green-500">of ${TOTAL_CHAPTERS} ch</div></div>
                    </div>
                    <div class="bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-2xl p-3 mb-4 flex items-center justify-between flex-wrap gap-2">
                        <span class="font-black">⏳ ${left} days left to finish with the Stake</span>
                        ${remaining>0?`<span class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full">~${perDay} ch/day to finish</span>`:`<span class="text-sm font-black bg-white/20 px-3 py-1 rounded-full">🎉 You finished!</span>`}
                    </div>
                    <div class="bg-gray-200 rounded-full h-6 overflow-hidden shadow-inner mb-4"><div class="h-full bg-gradient-to-r from-green-400 to-emerald-500 rounded-full transition-all duration-1000" style="width:${pct}%"></div></div>
                    ${renderBookMap(p)}
                    <div class="flex items-center gap-2 mt-4 flex-wrap justify-center">
                        <button onclick="adjustChapters(-1)" class="bg-gray-200 text-gray-700 w-11 h-11 rounded-lg font-black text-lg hover:bg-gray-300">−</button>

                    <div class="mt-4 flex gap-4"><button onclick="leaveEnrollment('read')" class="text-xs text-gray-400 underline">not you? switch</button><button onclick="removeMe('read')" class="text-xs text-red-400 underline">remove me</button></div>
                </div>`;

        function renderBadgeStrip(ck, p) {
            const badges = BADGES[ck]||[];
            const earned = earnedBadges(ck,p).length;
            return `<div class="mt-5 pt-4 border-t border-gray-100">
                <div class="text-sm font-black text-gray-600 mb-2">🏅 Badges (${earned}/${badges.length})</div>
                <div class="flex gap-2 flex-wrap">
                    ${badges.map(b=>{const has=b.test(p);return `<div class="flex items-center gap-1.5 rounded-full px-3 py-1.5 border-2 ${has?'bg-gradient-to-r from-amber-50 to-yellow-100 border-amber-300':'bg-gray-50 border-gray-200 opacity-50'}"><span class="text-lg ${has?'':'grayscale'}">${b.emoji}</span><span class="text-xs font-black ${has?'text-amber-900':'text-gray-400'}">${b.label}</span></div>`;}).join('')}
                </div>
            </div>`;
        }

        function renderBookMap(p) {
            let rem=p.chaptersRead||0;
            return `<div class="grid grid-cols-3 sm:grid-cols-5 gap-2">${BOM_BOOKS.map(b=>{const d=Math.min(b.ch,Math.max(0,rem));rem-=b.ch;const full=d>=b.ch;const part=d>0&&!full;return `<div class="rounded-lg px-2 py-2 text-center border-2 ${full?'bg-green-600 text-white border-green-700':part?'bg-green-100 text-green-800 border-green-300':'bg-gray-50 text-gray-400 border-gray-200'}"><div class="text-xs font-black leading-tight">${b.name}</div><div class="text-[10px] font-semibold">${Math.max(0,d)}/${b.ch}</div></div>`;}).join('')}</div>`;
        }

        function renderRace(ck) {
            const c=CHALLENGES[ck];
            const ranked=activeTeams(ck).map(t=>({...t,prog:teamProgress(ck,t.team)})).sort((a,b)=>b.prog-a.prog);
            if(!ranked.length) return `<div class="bg-white rounded-3xl shadow-xl p-8 mb-6 text-center"><div class="text-6xl mb-3">${c.racer}</div><p class="text-xl font-black ${c.text}">No teams racing yet — be the first!</p></div>`;
            const leader=ranked[0];
            return `<div class="bg-white rounded-3xl shadow-xl p-4 md:p-8 mb-6">
                <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
                    <h2 class="text-2xl md:text-3xl font-black ${c.text}">${c.racer} ${c.raceName}</h2>
                    <div class="bg-gradient-to-r ${c.grad} text-white px-4 py-2 rounded-full font-black shadow-lg">Leading: ${leader.team}</div>
                </div>
                <div class="space-y-4">
                    ${ranked.map((t,rank)=>{const pct=Math.round(t.prog*100);const pos=2+t.prog*84;const medal=rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;const racer=racerFor(ck,t.prog);return `<div>
                        <div class="flex items-center justify-between mb-1"><span class="font-black ${c.text} text-sm md:text-base">${medal} ${teamEmoji(t.team)} ${t.team}</span><span class="font-bold text-gray-600 text-xs md:text-sm">${pct}% · ${t.members.length} racer${t.members.length!==1?'s':''}</span></div>
                        <div class="${c.track} rounded-xl h-16 md:h-20 relative border-2 border-gray-300">
                            <div class="absolute top-0 bottom-0 right-1 flex items-center text-2xl md:text-3xl z-10">🏁</div>
                            <div class="racer-track absolute top-1/2 -translate-y-1/2 z-20" style="left:${pos}%;"><div class="${c.racerAnim} text-3xl md:text-4xl drop-shadow-lg">${racer}</div></div>
                        </div>
                    </div>`;}).join('')}
                </div>
                ${ck==='bom'?`<div class="mt-6 bg-amber-50 rounded-2xl p-4 border-2 border-amber-200"><div class="flex items-center justify-between mb-2"><span class="font-black text-amber-900">🎯 Ward Goal</span><span class="font-bold text-amber-700">${totalHandouts()} / ${state.settings.handoutGoal} ${state.leader?`<button onclick="setGoal()" class="text-xs underline ml-1">edit</button>`:''}</span></div><div class="bg-gray-200 rounded-full h-6 overflow-hidden"><div class="h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-1000" style="width:${Math.min(100,state.settings.handoutGoal?totalHandouts()/state.settings.handoutGoal*100:0)}%"></div></div></div>`:''}
            </div>`;
        }

        function renderLeaderboard(ck) {
            const c=CHALLENGES[ck];
            const people=[...state.data[ck]].sort((a,b)=>personProgress(ck,b)-personProgress(ck,a)).slice(0,10);
            const teams=activeTeams(ck).map(t=>({...t,prog:teamProgress(ck,t.team)})).sort((a,b)=>b.prog-a.prog);
            return `<div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden"><div class="bg-gradient-to-r ${c.grad} text-white p-4 font-black text-lg">🏆 Top Teams</div><div class="p-4 space-y-2">${teams.length?teams.map((t,i)=>`<div class="flex items-center justify-between py-2 ${i<teams.length-1?'border-b border-gray-100':''}"><span class="font-semibold text-gray-700 text-sm">${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'} ${teamEmoji(t.team)} ${t.team}</span><span class="font-black text-gray-900">${Math.round(t.prog*100)}%</span></div>`).join(''):'<p class="text-gray-400 text-center py-4">No data yet</p>'}</div></div>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden"><div class="bg-gradient-to-r ${c.grad} text-white p-4 font-black text-lg">⭐ Top Individuals</div><div class="p-4 space-y-2">${people.length?people.map((p,i)=>`<div class="flex items-center justify-between py-2 ${i<people.length-1?'border-b border-gray-100':''}"><span class="font-semibold text-gray-700 text-sm">${i<3?['🥇','🥈','🥉'][i]:(i+1)+'.'} ${p.name} · ${p.team}</span><span class="font-black text-gray-900">${personValue(ck,p)}</span></div>`).join(''):'<p class="text-gray-400 text-center py-4">No data yet</p>'}</div></div>
            </div>`;
        }

        function renderRoster(ck) {
            const c=CHALLENGES[ck];
            const teams=activeTeams(ck);
            if(!teams.length) return '';
            return `<div class="space-y-4">${teams.map(t=>`<div class="bg-white rounded-3xl shadow-xl p-4 md:p-6 border-2 ${c.border}">
                <div class="flex items-center justify-between mb-3 flex-wrap gap-2"><h3 class="text-lg md:text-xl font-black ${c.text}">${teamEmoji(t.team)} ${t.team}</h3><span class="${c.bg} ${c.text} px-3 py-1 rounded-full font-bold text-sm">${t.members.length} · ${Math.round(teamProgress(ck,t.team)*100)}%</span></div>
                <div class="grid sm:grid-cols-2 gap-2">${t.members.map(p=>`<div class="flex items-center justify-between ${c.bg} rounded-xl px-4 py-2 border ${c.border}"><span class="font-bold text-gray-800 text-sm">${teamEmoji(p.team)} ${p.name}</span><span class="flex items-center gap-2"><span class="font-black ${c.text} text-sm">${personValue(ck,p)}</span><button onclick="removePerson('${ck}','${p.id}')" title="Remove ${p.name}" class="text-red-400 hover:text-white hover:bg-red-500 rounded-lg px-2 py-1 text-base border border-red-200 transition-colors">🗑️</button></span></div>`).join('')}</div>
            </div>`).join('')}</div>`;
        }

        function renderJoin(ck) {
            const c=CHALLENGES[ck];
            return `
                <div class="mb-5"><button onclick="setView('c/${ck}')" class="bg-white text-blue-700 px-4 py-2 rounded-xl font-bold border-2 border-blue-200 hover:bg-blue-50">← Back to ${c.short}</button></div>
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border-2 ${c.border}">
                        <div class="flex items-center gap-2 mb-4"><span class="text-4xl">${c.emoji}</span><span class="bg-gradient-to-r ${c.grad} text-white px-3 py-1 rounded-full text-sm font-black">${c.tag}</span></div>
                        <h2 class="text-2xl font-black ${c.text} mb-5">Join ${c.title}</h2>
                        <div class="space-y-4">
                            <div><label class="block text-sm font-bold mb-2 text-gray-700">Your Name *</label><input id="jName" type="text" placeholder="First and last name" class="w-full px-4 py-3 border-2 ${c.border} rounded-xl focus:outline-none font-semibold" /></div>
                            <div><label class="block text-sm font-bold mb-2 text-gray-700">Ward Organization</label><select id="jOrg" class="w-full px-4 py-3 border-2 ${c.border} rounded-xl focus:outline-none font-semibold"><option value="">Select...</option>${ORGANIZATIONS.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>
                            <div>
                                <label class="block text-sm font-bold mb-2 text-gray-700">Pick your team * <span class="font-normal text-gray-400">(tap one)</span></label>
                                <input type="hidden" id="jTeam" value="" />
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-80 overflow-y-auto pr-1">
                                    ${c.teams.map(t=>{const n=teamMembers(ck,t).length;return `<button type="button" data-teamcard onclick="selectTeam(this,'${t}')" class="team-card ${c.bg} border-2 ${c.border} rounded-2xl px-2 py-3 text-center flex flex-col">
                                        <div class="text-3xl team-emoji">${teamEmoji(t)}</div>
                                        <div class="text-xs font-black ${c.text} mt-1 leading-tight">${t}</div>
                                        <div class="text-[10px] text-gray-500 italic mt-0.5 leading-snug flex-1">${teamTheme(t)}</div>
                                        ${n?`<div class="text-[10px] text-gray-400 font-bold mt-1">${n} aboard</div>`:''}
                                    </button>`;}).join('')}
                                </div>
                            </div>
                            <button onclick="joinChallenge('${ck}')" class="w-full bg-gradient-to-r ${c.grad} text-white px-6 py-4 rounded-xl font-black text-lg hover:opacity-90 transition-all shadow-lg hover-lift">${c.racer} Join the ${c.raceName}!</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border-2 border-blue-200 text-center">
                        <h2 class="text-2xl font-black text-blue-900 mb-3">📱 Scan to Join ${c.tag}</h2>
                        <div id="qrBox" class="inline-block p-4 bg-white rounded-2xl border-4 border-blue-200 shadow-inner"></div>
                        <div class="mt-4"><button onclick="printQR('${ck}')" class="bg-gradient-to-r from-blue-600 to-sky-600 text-white px-6 py-3 rounded-xl font-bold hover:opacity-90 transition-all shadow-lg">🖨️ Print QR Flyer</button></div>
                        <p class="text-xs text-gray-400 mt-4 break-all">${PAGE_URL}#join-${ck}</p>
                    </div>
                </div>`;
        }

        function renderWall() {
            const shout=state.wall.filter(w=>w.shoutout);
            return `<div class="space-y-6">
                ${shout.length?`<div class="bg-gradient-to-br from-amber-50 to-yellow-100 rounded-3xl shadow-xl p-6 border-2 border-amber-300"><h3 class="text-xl font-black text-amber-900 mb-3">📣 Leader Shout-Outs</h3><div class="space-y-3">${shout.map(w=>wallPost(w,true)).join('')}</div></div>`:''}
                <div class="bg-white rounded-3xl shadow-xl p-6"><h3 class="text-xl font-black text-blue-900 mb-3">💬 Share Your Experience</h3>
                    <select id="wallChallenge" class="w-full mb-3 px-4 py-2 border-2 border-blue-200 rounded-xl font-semibold">${Object.values(CHALLENGES).map(c=>`<option value="${c.key}">${c.emoji} ${c.short}</option>`).join('')}</select>
                    <textarea id="wallText" rows="3" placeholder="Share a thought, a verse, or an experience..." class="w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:outline-none"></textarea>
                    <button onclick="postToWall()" class="mt-3 bg-gradient-to-r from-blue-600 to-sky-600 text-white px-6 py-3 rounded-xl font-black hover:opacity-90 shadow-lg">Post</button>
                </div>
                <div class="space-y-3">${state.wall.filter(w=>!w.shoutout).length?state.wall.filter(w=>!w.shoutout).map(w=>wallPost(w,false)).join(''):'<div class="bg-white rounded-3xl shadow-xl p-10 text-center"><div class="text-6xl mb-3">💬</div><p class="text-xl font-black text-blue-900">No posts yet!</p></div>'}</div>
            </div>`;
        }
        function wallPost(w,isShout){ const c=CHALLENGES[w.ck]||CHALLENGES['21']; return `<div class="bg-white rounded-2xl p-4 shadow ${isShout?'border-2 border-amber-300':'border border-gray-100'}"><div class="flex items-start justify-between gap-3"><div class="flex-1"><div class="flex items-center gap-2 mb-1 flex-wrap"><span class="font-black text-blue-900">${w.name}</span><span class="bg-gradient-to-r ${c.grad} text-white px-2 py-0.5 rounded-full text-xs font-bold">${c.tag}</span><span class="text-gray-400 text-xs">${w.team||''}</span>${isShout?'<span>📣</span>':''}</div><p class="text-gray-700">${w.text}</p></div>${state.leader?`<div class="flex flex-col gap-1"><button onclick="toggleShoutout('${w.id}')" class="text-amber-500 hover:text-amber-700 text-sm">📣</button><button onclick="deletePost('${w.id}')" class="text-red-400 hover:text-red-600 text-sm">🗑️</button></div>`:''}</div></div>`; }

        function renderQRCode(ck) {
            const box=document.getElementById('qrBox'); if(!box) return;
            box.innerHTML='';
            new QRCode(box,{ text:PAGE_URL+'#join-'+ck, width:200, height:200, colorDark:'#1e3a5f', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.H });
        }

        render();
    </script>
</body>
</html>
