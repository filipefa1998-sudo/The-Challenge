<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Challenge — Riverton 24th Tongan Ward</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

        @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-6px) rotate(1deg);} }
        @keyframes waveMove { 0%{background-position-x:0;} 100%{background-position-x:80px;} }
        @keyframes pop { 0%{transform:scale(0);} 70%{transform:scale(1.2);} 100%{transform:scale(1);} }
        @keyframes confettiFall { 0%{transform:translateY(-20px) rotate(0);opacity:1;} 100%{transform:translateY(100vh) rotate(720deg);opacity:0;} }
        @keyframes fillUp { from{height:0;} }
        .boat { animation: bob 3s ease-in-out infinite; }
        .river { background: linear-gradient(180deg,#7dd3fc 0%,#38bdf8 40%,#0ea5e9 100%); position:relative; overflow:hidden; }
        .river::after { content:''; position:absolute; inset:0; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 8px, transparent 8px 40px); animation: waveMove 3s linear infinite; opacity:0.5; }
        .boat-track { transition: left 1.2s cubic-bezier(0.34,1.2,0.64,1); }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
        .hover-lift:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,0.2); }
        .pop { animation: pop 0.4s ease-out; }
        .confetti-piece { position:fixed; top:0; width:10px; height:10px; z-index:9999; animation: confettiFall 2.5s linear forwards; }
        @media (max-width:768px){ .hover-lift:hover{transform:none;} }
    </style>
</head>
<body class="min-h-screen">
    <div id="app"></div>
    <div id="confetti"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, remove, push } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAMTk39-yO86IA36-ZzBCtpLswW4skCIH4",
            authDomain: "focus5-cd663.firebaseapp.com",
            databaseURL: "https://focus5-cd663-default-rtdb.firebaseio.com",
            projectId: "focus5-cd663"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Independent data root for The Challenge
        const peopleRef = ref(db, 'theChallenge/people');
        const wallRef = ref(db, 'theChallenge/wall');
        const settingsRef = ref(db, 'theChallenge/settings');

        const CHALLENGE_DAYS = 21;
        const PAGE_URL = window.location.origin + window.location.pathname;
        const LEADER_CODE = 'riverton24'; // change to your own leader passcode
        const HANDOUT_GOAL_DEFAULT = 100; // ward-wide hand-out goal

        const ORGANIZATIONS = ['Elders Quorum','Relief Society','Young Men','Young Women','Primary','Sunday School','Young Single Adult'];
        const TEAMS = Array.from({length: 8}, (_, i) => `Team ${i+1}`);
        const TEAM_STYLE = [
            { boat:'⛵', color:'from-red-500 to-red-600', text:'text-red-700', bg:'bg-red-50', border:'border-red-300' },
            { boat:'🚤', color:'from-blue-500 to-blue-600', text:'text-blue-700', bg:'bg-blue-50', border:'border-blue-300' },
            { boat:'⛵', color:'from-green-500 to-green-600', text:'text-green-700', bg:'bg-green-50', border:'border-green-300' },
            { boat:'🚤', color:'from-purple-500 to-purple-600', text:'text-purple-700', bg:'bg-purple-50', border:'border-purple-300' },
            { boat:'⛵', color:'from-amber-500 to-amber-600', text:'text-amber-700', bg:'bg-amber-50', border:'border-amber-300' },
            { boat:'🚤', color:'from-pink-500 to-pink-600', text:'text-pink-700', bg:'bg-pink-50', border:'border-pink-300' },
            { boat:'⛵', color:'from-teal-500 to-teal-600', text:'text-teal-700', bg:'bg-teal-50', border:'border-teal-300' },
            { boat:'🚤', color:'from-indigo-500 to-indigo-600', text:'text-indigo-700', bg:'bg-indigo-50', border:'border-indigo-300' }
        ];

        // Book of Mormon books with chapter counts (for reading map)
        const BOM_BOOKS = [
            {name:'1 Nephi', ch:22}, {name:'2 Nephi', ch:33}, {name:'Jacob', ch:7}, {name:'Enos', ch:1},
            {name:'Jarom', ch:1}, {name:'Omni', ch:1}, {name:'W of Mormon', ch:1}, {name:'Mosiah', ch:29},
            {name:'Alma', ch:63}, {name:'Helaman', ch:16}, {name:'3 Nephi', ch:30}, {name:'4 Nephi', ch:1},
            {name:'Mormon', ch:9}, {name:'Ether', ch:15}, {name:'Moroni', ch:10}
        ];
        const TOTAL_CHAPTERS = BOM_BOOKS.reduce((s,b)=>s+b.ch,0); // 239

        const BADGES = [
            { id:'week1', label:'First Week', emoji:'🌱', test:p => streak(p) >= 7 || daysDone(p) >= 7 },
            { id:'week2', label:'Two Weeks Strong', emoji:'🌿', test:p => daysDone(p) >= 14 },
            { id:'finisher', label:'21-Day Finisher', emoji:'🏁', test:p => daysDone(p) >= CHALLENGE_DAYS },
            { id:'perfectweek', label:'Perfect Week', emoji:'⭐', test:p => streak(p) >= 7 },
            { id:'missionary', label:'Missionary', emoji:'📕', test:p => (p.handouts||0) >= 5 },
            { id:'reader', label:'Halfway Reader', emoji:'📖', test:p => (p.chaptersRead||0) >= TOTAL_CHAPTERS/2 },
            { id:'complete', label:'Scripture Champion', emoji:'👑', test:p => (p.chaptersRead||0) >= TOTAL_CHAPTERS }
        ];

        let state = {
            people: [],
            wall: [],
            settings: { handoutGoal: HANDOUT_GOAL_DEFAULT },
            loaded: false,
            me: localStorage.getItem('tc_me') || null,   // my participant id
            view: 'home',   // home | dashboard | challenges | race | leaders | wall | join
            leader: false,
            message: ''
        };
        if (window.location.hash === '#join') state.view = 'join';

        onValue(peopleRef, (snap) => {
            const d = snap.val();
            state.people = d ? Object.keys(d).map(k => ({ id:k, ...d[k] })) : [];
            state.loaded = true;
            render();
        });
        onValue(wallRef, (snap) => {
            const d = snap.val();
            state.wall = d ? Object.keys(d).map(k => ({ id:k, ...d[k] })).sort((a,b)=> (b.ts||0)-(a.ts||0)) : [];
            render();
        });
        onValue(settingsRef, (snap) => {
            const d = snap.val();
            if (d) state.settings = { ...state.settings, ...d };
            render();
        });

        // ---------- helpers ----------
        const me = () => state.people.find(p => p.id === state.me) || null;
        const daysDone = p => (p.days || []).filter(Boolean).length;
        const isFinisher = p => daysDone(p) >= CHALLENGE_DAYS;
        const teamMembers = t => state.people.filter(p => p.team === t);
        const activeTeams = () => TEAMS.map((t,i)=>({team:t,idx:i,members:teamMembers(t)})).filter(x=>x.members.length>0);

        function streak(p) {
            // Longest trailing run of consecutive true days from the most recent checked day
            const days = p.days || [];
            let best = 0, run = 0;
            for (let i = 0; i < days.length; i++) {
                if (days[i]) { run++; best = Math.max(best, run); }
                else run = 0;
            }
            return best;
        }
        function teamReadingProgress(t) {
            const m = teamMembers(t);
            if (!m.length) return 0;
            const total = m.reduce((s,p)=>s+(p.chaptersRead||0),0);
            return total / (m.length * TOTAL_CHAPTERS);
        }
        function teamDayProgress(t) {
            const m = teamMembers(t);
            if (!m.length) return 0;
            const total = m.reduce((s,p)=>s+daysDone(p),0);
            return total / (m.length * CHALLENGE_DAYS);
        }
        function teamHandouts(t) { return teamMembers(t).reduce((s,p)=>s+(p.handouts||0),0); }
        // Combined race score: blends 21-day consistency + reading + handouts
        function teamRaceScore(t) {
            const days = teamDayProgress(t);            // 0..1
            const read = teamReadingProgress(t);        // 0..1
            const hand = Math.min(1, teamHandouts(t) / 25); // cap contribution
            return (days * 0.45) + (read * 0.45) + (hand * 0.10);
        }
        const totalHandouts = () => state.people.reduce((s,p)=>s+(p.handouts||0),0);

        function confetti() {
            const c = document.getElementById('confetti');
            const colors = ['#f59e0b','#ef4444','#3b82f6','#10b981','#8b5cf6','#ec4899'];
            for (let i=0;i<50;i++){
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.left = Math.random()*100+'%';
                el.style.background = colors[Math.floor(Math.random()*colors.length)];
                el.style.animationDelay = Math.random()*0.5+'s';
                el.style.borderRadius = Math.random()>0.5?'50%':'0';
                c.appendChild(el);
                setTimeout(()=>el.remove(), 3000);
            }
        }
        function showMessage(m){ state.message=m; render(); setTimeout(()=>{state.message='';render();},3000); }

        // ---------- actions ----------
        window.setView = v => { state.view = v; render(); };

        window.joinChallenge = () => {
            const name = document.getElementById('jName').value.trim();
            const org = document.getElementById('jOrg').value;
            const team = document.getElementById('jTeam').value;
            if (!name) { alert('Please enter your name'); return; }
            if (!team) { alert('Please pick a team'); return; }
            const id = 'p_' + Date.now();
            set(ref(db, `theChallenge/people/${id}`), {
                name, org, team,
                days: Array(CHALLENGE_DAYS).fill(false),
                handouts: 0,
                chaptersRead: 0,
                startDate: new Date().toISOString().split('T')[0],
                completedDate: null,
                seenBadges: [],
                createdAt: new Date().toISOString()
            }).then(()=>{
                state.me = id;
                localStorage.setItem('tc_me', id);
                state.view = 'dashboard';
                confetti();
                showMessage(`🎉 Welcome aboard, ${name}! You're on ${team}.`);
            });
        };

        window.pickMe = (id) => { state.me = id; localStorage.setItem('tc_me', id); state.view='dashboard'; render(); };
        window.signOut = () => { state.me=null; localStorage.removeItem('tc_me'); state.view='home'; render(); };

        window.toggleDay = (dayIdx) => {
            const p = me(); if(!p) return;
            const days = [...(p.days||Array(CHALLENGE_DAYS).fill(false))];
            days[dayIdx] = !days[dayIdx];
            const count = days.filter(Boolean).length;
            const completedDate = count>=CHALLENGE_DAYS ? (p.completedDate||new Date().toISOString().split('T')[0]) : null;
            update(ref(db,`theChallenge/people/${p.id}`), { days, completedDate }).then(()=>{
                if (days[dayIdx]) checkBadges();
            });
        };
        window.checkToday = () => {
            const p = me(); if(!p) return;
            const days = [...(p.days||Array(CHALLENGE_DAYS).fill(false))];
            const next = days.findIndex(d=>!d);
            if (next === -1) { showMessage('🏁 You already finished all 21 days!'); return; }
            days[next] = true;
            const count = days.filter(Boolean).length;
            const completedDate = count>=CHALLENGE_DAYS ? (p.completedDate||new Date().toISOString().split('T')[0]) : null;
            update(ref(db,`theChallenge/people/${p.id}`), { days, completedDate }).then(()=>{ confetti(); checkBadges(); });
        };

        window.addHandout = (n) => {
            const p = me(); if(!p) return;
            const handouts = Math.max(0, (p.handouts||0) + n);
            update(ref(db,`theChallenge/people/${p.id}`), { handouts }).then(()=>{ if(n>0) checkBadges(); });
        };
        window.adjustChapters = (n) => {
            const p = me(); if(!p) return;
            const chaptersRead = Math.min(TOTAL_CHAPTERS, Math.max(0, (p.chaptersRead||0) + n));
            update(ref(db,`theChallenge/people/${p.id}`), { chaptersRead }).then(()=>{ if(n>0) checkBadges(); });
        };
        window.setChapters = (val) => {
            const p = me(); if(!p) return;
            const chaptersRead = Math.min(TOTAL_CHAPTERS, Math.max(0, parseInt(val)||0));
            update(ref(db,`theChallenge/people/${p.id}`), { chaptersRead });
        };

        function checkBadges() {
            const p = me(); if(!p) return;
            const earned = BADGES.filter(b => b.test(p)).map(b=>b.id);
            const seen = p.seenBadges || [];
            const fresh = earned.filter(id => !seen.includes(id));
            if (fresh.length) {
                update(ref(db,`theChallenge/people/${p.id}`), { seenBadges: earned });
                const b = BADGES.find(x=>x.id===fresh[0]);
                confetti();
                showMessage(`${b.emoji} Badge earned: ${b.label}!`);
            }
        }

        window.postToWall = () => {
            const p = me();
            const text = document.getElementById('wallText').value.trim();
            if (!text) return;
            if (!p) { alert('Join the challenge first to post.'); return; }
            push(wallRef, {
                name: p.name, team: p.team, text, ts: Date.now(), shoutout: false
            }).then(()=>{ document.getElementById('wallText').value=''; showMessage('💬 Posted to the wall!'); });
        };
        window.deletePost = (id) => {
            if (!state.leader && !confirm('Delete this post?')) return;
            remove(ref(db,`theChallenge/wall/${id}`));
        };
        window.toggleShoutout = (id) => {
            if (!state.leader) return;
            const post = state.wall.find(w=>w.id===id);
            update(ref(db,`theChallenge/wall/${id}`), { shoutout: !post.shoutout });
        };

        window.enterLeader = () => {
            const code = prompt('Enter leader code:');
            if (code === LEADER_CODE) { state.leader = true; showMessage('🔑 Leader mode on.'); }
            else if (code !== null) showMessage('Incorrect code.');
        };
        window.removePerson = (id) => {
            if (!state.leader) { showMessage('Leader mode required.'); return; }
            const p = state.people.find(x=>x.id===id);
            if (confirm(`Remove ${p.name}?`)) remove(ref(db,`theChallenge/people/${id}`));
        };
        window.setGoal = () => {
            if (!state.leader) return;
            const g = prompt('Ward hand-out goal:', state.settings.handoutGoal);
            if (g) update(settingsRef, { handoutGoal: parseInt(g)||HANDOUT_GOAL_DEFAULT });
        };

        window.printQR = () => {
            const qr = document.getElementById('qrBox').innerHTML;
            const w = window.open('','_blank');
            w.document.write(`<html><head><title>The Challenge QR</title><style>body{font-family:sans-serif;text-align:center;padding:40px;}h1{color:#1e3a5f;}p{color:#555;font-size:18px;}</style></head><body><h1>📖 The Challenge</h1><p>Riverton 24th Tongan Ward</p><div style="display:inline-block;padding:20px;border:4px solid #d97706;border-radius:20px;margin:20px;">${qr}</div><p><strong>Scan to join!</strong></p><p style="font-size:14px;color:#888;">${PAGE_URL}</p></body></html>`);
            w.document.close(); setTimeout(()=>w.print(),400);
        };

        // ---------- rendering ----------
        function render() {
            const el = document.getElementById('app');
            if (!state.loaded) {
                el.innerHTML = `<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-100 to-blue-200"><div class="text-center"><div class="text-6xl mb-4">📖</div><p class="text-xl font-bold text-blue-900">Loading The Challenge...</p></div></div>`;
                return;
            }
            const p = me();
            el.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-sky-100 via-blue-100 to-indigo-100">
                    <div class="max-w-6xl mx-auto p-3 md:p-6">
                        <div class="text-center pt-4 mb-5">
                            <div class="text-5xl md:text-7xl mb-2">📖⛵🏁</div>
                            <h1 class="text-3xl md:text-5xl font-black text-blue-900">The Challenge</h1>
                            <p class="text-lg md:text-2xl font-bold text-blue-700">Riverton 24th Tongan Ward</p>
                        </div>

                        ${state.message ? `<div class="mb-4 p-4 bg-green-500 text-white rounded-2xl font-bold text-center shadow-xl pop">${state.message}</div>` : ''}

                        <!-- Nav -->
                        <div class="flex gap-2 justify-center mb-6 flex-wrap">
                            ${navBtn('home','🏠 Home')}
                            ${p ? navBtn('dashboard','📊 My Progress') : ''}
                            ${navBtn('race','🚤 Race')}
                            ${navBtn('leaders','🏆 Leaders')}
                            ${navBtn('wall','💬 Wall')}
                            ${navBtn('join', p ? '➕ QR' : '➕ Join / QR', 'amber')}
                        </div>

                        ${renderView()}

                        <!-- footer -->
                        <div class="text-center mt-8 pb-6 text-sm text-blue-500">
                            ${p ? `Signed in as <strong>${p.name}</strong> · ${p.team} · <button onclick="signOut()" class="underline">switch person</button>` : ''}
                            ${state.leader ? ' · 🔑 Leader mode' : ` · <button onclick="enterLeader()" class="underline">leader login</button>`}
                        </div>
                    </div>
                </div>
            `;
            if (state.view === 'join') renderQRCode();
        }

        function navBtn(v, label, tone='blue') {
            const on = state.view === v;
            const active = tone==='amber' ? 'bg-gradient-to-r from-amber-600 to-amber-700 text-white border-amber-800' : 'bg-gradient-to-r from-blue-600 to-sky-600 text-white border-blue-800';
            const off = tone==='amber' ? 'bg-white text-amber-800 border-amber-200 hover:bg-amber-50' : 'bg-white text-blue-800 border-blue-200 hover:bg-blue-50';
            return `<button onclick="setView('${v}')" class="px-4 md:px-6 py-2.5 md:py-3 rounded-xl font-black text-xs md:text-base transition-all hover-lift border-2 ${on?active:off} shadow">${label}</button>`;
        }

        function renderView() {
            switch(state.view) {
                case 'home': return renderHome();
                case 'dashboard': return renderDashboard();
                case 'race': return renderRace();
                case 'leaders': return renderLeaders();
                case 'wall': return renderWall();
                case 'join': return renderJoin();
                default: return renderHome();
            }
        }

        function renderHome() {
            const totalPeople = state.people.length;
            const finishers = state.people.filter(isFinisher).length;
            const chapters = state.people.reduce((s,p)=>s+(p.chaptersRead||0),0);
            const handouts = totalHandouts();
            const goal = state.settings.handoutGoal;
            return `
                <div class="grid md:grid-cols-4 gap-4 mb-6">
                    ${statCard('👥', totalPeople, 'Participants', 'from-blue-500 to-cyan-500')}
                    ${statCard('🏁', finishers, '21-Day Finishers', 'from-green-500 to-emerald-500')}
                    ${statCard('📖', chapters, 'Chapters Read', 'from-purple-500 to-indigo-500')}
                    ${statCard('📕', handouts + ' / ' + goal, 'Books Handed Out', 'from-amber-500 to-orange-500')}
                </div>

                <!-- Ward hand-out thermometer -->
                <div class="bg-white rounded-3xl shadow-xl p-6 mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-xl font-black text-amber-900">📕 Ward Hand-Out Goal</h3>
                        <span class="font-bold text-amber-700">${handouts} / ${goal} ${state.leader?`<button onclick="setGoal()" class="ml-2 text-xs underline">edit goal</button>`:''}</span>
                    </div>
                    <div class="bg-gray-200 rounded-full h-8 overflow-hidden shadow-inner">
                        <div class="h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-1000 flex items-center justify-end pr-3" style="width:${Math.min(100, goal? (handouts/goal*100):0)}%">
                            ${handouts>0?`<span class="text-white text-sm font-black">${Math.round(goal?handouts/goal*100:0)}%</span>`:''}
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 text-center">
                    <div class="text-5xl mb-3">⛵</div>
                    <h2 class="text-2xl md:text-3xl font-black text-blue-900 mb-2">Three challenges. One voyage.</h2>
                    <p class="text-blue-600 font-semibold mb-5">21-Day Reading Streak · Book of Mormon Hand-Out · Read the Book of Mormon</p>
                    <button onclick="setView('join')" class="bg-gradient-to-r from-amber-600 to-amber-700 text-white px-8 py-4 rounded-xl font-black text-lg hover:from-amber-700 hover:to-amber-800 transition-all shadow-lg hover-lift">Join The Challenge →</button>
                    ${!me() && state.people.length ? `<div class="mt-6"><p class="text-sm text-blue-500 mb-2">Already joined? Tap your name:</p><div class="flex flex-wrap gap-2 justify-center">${state.people.slice(0,40).map(p=>`<button onclick="pickMe('${p.id}')" class="bg-blue-50 text-blue-800 px-3 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-100 border border-blue-200">${p.name}</button>`).join('')}</div></div>`:''}
                </div>
            `;
        }

        function statCard(emoji, val, label, grad) {
            return `<div class="bg-gradient-to-br ${grad} text-white rounded-3xl shadow-xl p-5 text-center hover-lift">
                <div class="text-4xl mb-2">${emoji}</div>
                <div class="text-3xl md:text-4xl font-black">${val}</div>
                <div class="text-xs md:text-sm opacity-90 font-semibold mt-1">${label}</div>
            </div>`;
        }

        function renderDashboard() {
            const p = me();
            if (!p) return `<div class="bg-white rounded-3xl shadow-xl p-10 text-center"><p class="text-xl font-black text-blue-900">Join first to see your dashboard.</p></div>`;
            const done = daysDone(p);
            const st = streak(p);
            const earned = BADGES.filter(b=>b.test(p));
            const readPct = Math.round((p.chaptersRead||0)/TOTAL_CHAPTERS*100);
            const style = TEAM_STYLE[TEAMS.indexOf(p.team)] || TEAM_STYLE[0];
            const nextDay = (p.days||[]).findIndex(d=>!d);
            return `
                <div class="space-y-6">
                    <!-- greeting -->
                    <div class="bg-gradient-to-r ${style.color} text-white rounded-3xl shadow-xl p-6 flex items-center justify-between flex-wrap gap-3">
                        <div>
                            <h2 class="text-3xl font-black">Ahoy, ${p.name}! ${style.boat}</h2>
                            <p class="opacity-90 font-semibold">${p.team} · ${p.org||'—'}</p>
                        </div>
                        <div class="text-center bg-white/20 rounded-2xl px-6 py-3">
                            <div class="text-4xl font-black">🔥 ${st}</div>
                            <div class="text-xs opacity-90">day streak</div>
                        </div>
                    </div>

                    <!-- daily check-in -->
                    <div class="bg-white rounded-3xl shadow-xl p-6 text-center">
                        ${done>=CHALLENGE_DAYS
                            ? `<div class="text-5xl mb-2">🏁</div><p class="text-2xl font-black text-green-700">All 21 days complete!</p><p class="text-green-600 font-semibold">Finished ${p.completedDate?new Date(p.completedDate).toLocaleDateString():''}</p>`
                            : `<p class="text-lg font-bold text-blue-800 mb-3">Have you read today?</p><button onclick="checkToday()" class="bg-gradient-to-r from-green-500 to-emerald-600 text-white px-10 py-5 rounded-2xl font-black text-xl hover:from-green-600 hover:to-emerald-700 transition-all shadow-lg hover-lift">✓ Check In (Day ${nextDay+1})</button>`}
                    </div>

                    <!-- 21 day grid -->
                    <div class="bg-white rounded-3xl shadow-xl p-6">
                        <h3 class="text-xl font-black text-blue-900 mb-4">📅 21-Day Streak <span class="text-blue-500 text-base font-bold">(${done}/21)</span></h3>
                        <div class="grid grid-cols-7 gap-2">
                            ${Array.from({length:CHALLENGE_DAYS},(_, d)=>{
                                const c = (p.days||[])[d];
                                return `<button onclick="toggleDay(${d})" class="aspect-square rounded-xl text-sm font-black flex items-center justify-center transition-all ${c?`bg-gradient-to-br ${style.color} text-white shadow-md`:'bg-gray-100 text-gray-400 border-2 border-gray-200 hover:border-gray-400'}">${c?'✓':d+1}</button>`;
                            }).join('')}
                        </div>
                    </div>

                    <!-- reading challenge -->
                    <div class="bg-white rounded-3xl shadow-xl p-6">
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <h3 class="text-xl font-black text-purple-900">📖 Read the Book of Mormon</h3>
                            <span class="font-bold text-purple-700">${p.chaptersRead||0} / ${TOTAL_CHAPTERS} chapters (${readPct}%)</span>
                        </div>
                        <div class="bg-gray-200 rounded-full h-6 overflow-hidden shadow-inner mb-4">
                            <div class="h-full bg-gradient-to-r from-purple-400 to-indigo-500 rounded-full transition-all duration-1000" style="width:${readPct}%"></div>
                        </div>
                        ${renderBookMap(p)}
                        <div class="flex items-center gap-2 mt-4 flex-wrap">
                            <button onclick="adjustChapters(-1)" class="bg-gray-200 text-gray-700 w-10 h-10 rounded-lg font-black text-lg hover:bg-gray-300">−</button>
                            <button onclick="adjustChapters(1)" class="bg-purple-600 text-white px-5 h-10 rounded-lg font-black hover:bg-purple-700">+1 chapter</button>
                            <button onclick="adjustChapters(5)" class="bg-purple-500 text-white px-5 h-10 rounded-lg font-black hover:bg-purple-600">+5</button>
                            <span class="text-sm text-gray-500 ml-2">or set total:</span>
                            <input type="number" value="${p.chaptersRead||0}" min="0" max="${TOTAL_CHAPTERS}" onchange="setChapters(this.value)" class="w-20 px-3 h-10 border-2 border-purple-200 rounded-lg font-bold" />
                        </div>
                    </div>

                    <!-- hand-out challenge -->
                    <div class="bg-white rounded-3xl shadow-xl p-6">
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <h3 class="text-xl font-black text-amber-900">📕 Book of Mormon Hand-Out</h3>
                            <span class="font-bold text-amber-700 text-2xl">${p.handouts||0} handed out</span>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <button onclick="addHandout(-1)" class="bg-gray-200 text-gray-700 w-10 h-10 rounded-lg font-black text-lg hover:bg-gray-300">−</button>
                            <button onclick="addHandout(1)" class="bg-amber-600 text-white px-6 h-10 rounded-lg font-black hover:bg-amber-700">+1 handed out 🙌</button>
                        </div>
                    </div>

                    <!-- badges -->
                    <div class="bg-white rounded-3xl shadow-xl p-6">
                        <h3 class="text-xl font-black text-blue-900 mb-4">🏅 Badges <span class="text-blue-500 text-base font-bold">(${earned.length}/${BADGES.length})</span></h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            ${BADGES.map(b=>{
                                const has = b.test(p);
                                return `<div class="rounded-2xl p-4 text-center border-2 ${has?'bg-gradient-to-br from-amber-50 to-yellow-100 border-amber-300':'bg-gray-50 border-gray-200 opacity-50'}">
                                    <div class="text-4xl mb-1 ${has?'':'grayscale'}">${b.emoji}</div>
                                    <div class="text-xs font-black ${has?'text-amber-900':'text-gray-400'}">${b.label}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderBookMap(p) {
            let remaining = p.chaptersRead || 0;
            return `<div class="grid grid-cols-3 sm:grid-cols-5 gap-2">
                ${BOM_BOOKS.map(b=>{
                    const doneHere = Math.min(b.ch, Math.max(0, remaining));
                    remaining -= b.ch;
                    const full = doneHere >= b.ch;
                    const partial = doneHere > 0 && !full;
                    return `<div class="rounded-lg px-2 py-2 text-center border-2 ${full?'bg-purple-600 text-white border-purple-700':partial?'bg-purple-100 text-purple-800 border-purple-300':'bg-gray-50 text-gray-400 border-gray-200'}">
                        <div class="text-xs font-black leading-tight">${b.name}</div>
                        <div class="text-[10px] font-semibold">${Math.max(0,doneHere)}/${b.ch}</div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        function renderRace() {
            const ranked = activeTeams().map(t=>({...t, score:teamRaceScore(t.team)})).sort((a,b)=>b.score-a.score);
            if (!ranked.length) return `<div class="bg-white rounded-3xl shadow-xl p-10 text-center"><div class="text-7xl mb-4">🌊</div><p class="text-2xl font-black text-blue-900">The river is calm...</p><p class="text-blue-600 mt-2">No teams have set sail yet.</p></div>`;
            const leader = ranked[0];
            return `
                <div class="bg-white rounded-3xl shadow-xl p-4 md:p-8 mb-6">
                    <div class="flex items-center justify-between mb-6 flex-wrap gap-2">
                        <h2 class="text-2xl md:text-3xl font-black text-blue-900">🏆 Team Boat Race</h2>
                        <div class="bg-gradient-to-r ${TEAM_STYLE[leader.idx].color} text-white px-4 py-2 rounded-full font-black shadow-lg">Leading: ${leader.team} ${TEAM_STYLE[leader.idx].boat}</div>
                    </div>
                    <div class="space-y-4">
                        ${ranked.map((t,rank)=>{
                            const s = TEAM_STYLE[t.idx];
                            const pct = Math.round(t.score*100);
                            const pos = 2 + t.score*84;
                            const medal = rank===0?'🥇':rank===1?'🥈':rank===2?'🥉':`#${rank+1}`;
                            return `<div>
                                <div class="flex items-center justify-between mb-1">
                                    <span class="font-black ${s.text} text-sm md:text-base">${medal} ${t.team}</span>
                                    <span class="font-bold text-blue-700 text-xs md:text-sm">${pct}% · ${t.members.length} sailor${t.members.length!==1?'s':''}</span>
                                </div>
                                <div class="river rounded-xl h-16 md:h-20 relative border-2 border-sky-300">
                                    <div class="absolute top-0 bottom-0 right-1 flex items-center text-2xl md:text-3xl z-10">🏁</div>
                                    <div class="boat-track absolute top-1/2 -translate-y-1/2 z-20" style="left:${pos}%;"><div class="boat text-3xl md:text-4xl drop-shadow-lg">${s.boat}</div></div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="mt-6 bg-sky-50 rounded-2xl p-4 border-2 border-sky-200">
                        <p class="text-sm text-blue-800 font-semibold">🌊 Boats advance from all three challenges combined — daily reading (45%), chapters read (45%), and books handed out (10%). Steady, consistent teams pull ahead!</p>
                    </div>
                </div>
            `;
        }

        function renderLeaders() {
            const byDays = [...state.people].sort((a,b)=> daysDone(b)-daysDone(a) || streak(b)-streak(a)).slice(0,10);
            const byRead = [...state.people].sort((a,b)=> (b.chaptersRead||0)-(a.chaptersRead||0)).slice(0,10);
            const byHand = [...state.people].sort((a,b)=> (b.handouts||0)-(a.handouts||0)).slice(0,10);
            const teamRank = activeTeams().map(t=>({...t,score:teamRaceScore(t.team)})).sort((a,b)=>b.score-a.score);
            return `
                <div class="grid md:grid-cols-2 gap-6">
                    ${leaderCard('🏆 Top Teams', teamRank.map((t,i)=>({label:`${TEAM_STYLE[t.idx].boat} ${t.team}`, val:Math.round(t.score*100)+'%'})), 'from-blue-500 to-sky-600')}
                    ${leaderCard('🔥 Reading Streak', byDays.map(p=>({label:p.name+' · '+p.team, val:daysDone(p)+' days'})), 'from-green-500 to-emerald-600')}
                    ${leaderCard('📖 Chapters Read', byRead.map(p=>({label:p.name+' · '+p.team, val:(p.chaptersRead||0)})), 'from-purple-500 to-indigo-600')}
                    ${leaderCard('📕 Books Handed Out', byHand.map(p=>({label:p.name+' · '+p.team, val:(p.handouts||0)})), 'from-amber-500 to-orange-600')}
                </div>
            `;
        }
        function leaderCard(title, rows, grad) {
            return `<div class="bg-white rounded-3xl shadow-xl overflow-hidden">
                <div class="bg-gradient-to-r ${grad} text-white p-4 font-black text-lg">${title}</div>
                <div class="p-4 space-y-2">
                    ${rows.length? rows.map((r,i)=>`<div class="flex items-center justify-between py-2 ${i<rows.length-1?'border-b border-gray-100':''}">
                        <span class="font-semibold text-gray-700 text-sm">${i<3?['🥇','🥈','🥉'][i]:'&nbsp;&nbsp;'+( i+1)+'.'} ${r.label}</span>
                        <span class="font-black text-gray-900">${r.val}</span>
                    </div>`).join('') : '<p class="text-gray-400 text-center py-4">No data yet</p>'}
                </div>
            </div>`;
        }

        function renderWall() {
            const shoutouts = state.wall.filter(w=>w.shoutout);
            return `
                <div class="space-y-6">
                    ${shoutouts.length?`<div class="bg-gradient-to-br from-amber-50 to-yellow-100 rounded-3xl shadow-xl p-6 border-2 border-amber-300">
                        <h3 class="text-xl font-black text-amber-900 mb-3">📣 Leader Shout-Outs</h3>
                        <div class="space-y-3">${shoutouts.map(w=>wallPost(w,true)).join('')}</div>
                    </div>`:''}

                    <div class="bg-white rounded-3xl shadow-xl p-6">
                        <h3 class="text-xl font-black text-blue-900 mb-3">💬 Share Your Experience</h3>
                        <textarea id="wallText" rows="3" placeholder="Something you read, a thought, or an experience handing out a Book of Mormon..." class="w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:border-blue-500 focus:outline-none"></textarea>
                        <button onclick="postToWall()" class="mt-3 bg-gradient-to-r from-blue-600 to-sky-600 text-white px-6 py-3 rounded-xl font-black hover:from-blue-700 hover:to-sky-700 transition-all shadow-lg">Post to Wall</button>
                    </div>

                    <div class="space-y-3">
                        ${state.wall.filter(w=>!w.shoutout).length? state.wall.filter(w=>!w.shoutout).map(w=>wallPost(w,false)).join('') : '<div class="bg-white rounded-3xl shadow-xl p-10 text-center"><div class="text-6xl mb-3">💬</div><p class="text-xl font-black text-blue-900">No posts yet — be the first to share!</p></div>'}
                    </div>
                </div>
            `;
        }
        function wallPost(w, isShout) {
            const style = TEAM_STYLE[TEAMS.indexOf(w.team)] || TEAM_STYLE[0];
            return `<div class="bg-white rounded-2xl p-4 shadow ${isShout?'border-2 border-amber-300':'border border-gray-100'}">
                <div class="flex items-start justify-between gap-3">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-black text-blue-900">${w.name}</span>
                            <span class="${style.bg} ${style.text} px-2 py-0.5 rounded-full text-xs font-bold">${w.team}</span>
                            ${isShout?'<span class="text-amber-600">📣</span>':''}
                        </div>
                        <p class="text-gray-700">${w.text}</p>
                    </div>
                    ${state.leader?`<div class="flex flex-col gap-1">
                        <button onclick="toggleShoutout('${w.id}')" class="text-amber-500 hover:text-amber-700 text-sm" title="Toggle shout-out">📣</button>
                        <button onclick="deletePost('${w.id}')" class="text-red-400 hover:text-red-600 text-sm">🗑️</button>
                    </div>`:''}
                </div>
            </div>`;
        }

        function renderJoin() {
            return `
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border-2 border-amber-200">
                        <h2 class="text-2xl md:text-3xl font-black text-amber-900 mb-6">➕ Join The Challenge</h2>
                        <div class="space-y-4">
                            <div><label class="block text-sm font-bold mb-2 text-gray-700">Your Name *</label>
                                <input id="jName" type="text" placeholder="First and last name" class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl focus:border-amber-500 focus:outline-none font-semibold" /></div>
                            <div><label class="block text-sm font-bold mb-2 text-gray-700">Ward Organization</label>
                                <select id="jOrg" class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl focus:border-amber-500 focus:outline-none font-semibold"><option value="">Select...</option>${ORGANIZATIONS.map(o=>`<option value="${o}">${o}</option>`).join('')}</select></div>
                            <div><label class="block text-sm font-bold mb-2 text-gray-700">Challenge Team *</label>
                                <select id="jTeam" class="w-full px-4 py-3 border-2 border-amber-200 rounded-xl focus:border-amber-500 focus:outline-none font-semibold"><option value="">Pick your boat...</option>${TEAMS.map((t,i)=>`<option value="${t}">${TEAM_STYLE[i].boat} ${t} (${teamMembers(t).length} aboard)</option>`).join('')}</select></div>
                            <button onclick="joinChallenge()" class="w-full bg-gradient-to-r from-amber-600 to-amber-700 text-white px-6 py-4 rounded-xl font-black text-lg hover:from-amber-700 hover:to-amber-800 transition-all shadow-lg hover-lift">⛵ Set Sail!</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl shadow-xl p-6 md:p-8 border-2 border-blue-200 text-center">
                        <h2 class="text-2xl md:text-3xl font-black text-blue-900 mb-4">📱 Scan to Join</h2>
                        <p class="text-sm text-blue-600 mb-4 font-semibold">Share this QR — anyone who scans lands right here.</p>
                        <div id="qrBox" class="inline-block p-4 bg-white rounded-2xl border-4 border-blue-200 shadow-inner"></div>
                        <div class="mt-4"><button onclick="printQR()" class="bg-gradient-to-r from-blue-600 to-sky-600 text-white px-6 py-3 rounded-xl font-bold hover:from-blue-700 hover:to-sky-700 transition-all shadow-lg hover-lift">🖨️ Print QR Flyer</button></div>
                        <p class="text-xs text-gray-400 mt-4 break-all">${PAGE_URL}</p>
                    </div>
                </div>
            `;
        }

        function renderQRCode() {
            const box = document.getElementById('qrBox');
            if (!box) return;
            box.innerHTML = '';
            new QRCode(box, { text: PAGE_URL + '#join', width:200, height:200, colorDark:'#1e3a5f', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.H });
        }

        render();
    </script>
</body>
</html>
